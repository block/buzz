name: buzz

services:
  postgres:
    image: postgres:17-alpine
    container_name: buzz-postgres
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "postgres"
      com.buzz.env: "dev"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    ports:
      - "6379:6379"
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "redis"
      com.buzz.env: "dev"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: buzz-adminer
    ports:
      - "8082:8080"
    networks:
      - buzz-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    deploy:
      resources:
        limits:
          memory: 64m
    labels:
      com.buzz.service: "adminer"
      com.buzz.env: "dev"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: buzz-keycloak
    command: start-dev --http-port=8080
    environment:
      KC_DB: dev-mem
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    networks:
      - buzz-net
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "keycloak"
      com.buzz.env: "dev"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: buzz-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: buzz_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    labels:
      com.buzz.service: "minio"
      com.buzz.env: "dev"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: buzz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - buzz-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 buzz_dev buzz_dev_secret &&
        mc mb --ignore-existing local/buzz-media &&
        mc anonymous set none local/buzz-media
      "
    labels:
      com.buzz.service: "minio-init"
      com.buzz.env: "dev"
    restart: "no"

  # Phase 3 Mac-local command Memory authority. This profile is deliberately
  # opt-in: Buzz does not claim the companion AgentMemory image is built or
  # deployed merely because the topology is present.
  memory:
    image: ${BUZZ_MEMORY_MCP_IMAGE:-memory-mcp:local}
    pull_policy: never
    profiles: ["command-memory"]
    container_name: buzz-memory
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        export MEMORY_REPLICATION_TOKENS="$$(cat /run/secrets/memory-replication-tokens)"
        exec memory-mcp
    environment:
      MEMORY_HOST: 0.0.0.0
      MEMORY_PORT: "8006"
      MEMORY_VAULT_ROOT: /data/current
      MEMORY_INDEX_ROOT: /data/index
      MEMORY_NODE_ID: ${BUZZ_MEMORY_NODE_ID:-node:macbook-command}
      MEMORY_REPLICATION_MAX_ITEMS: "200"
      MEMORY_REPLICATION_MAX_BYTES: "2097152"
    ports:
      - "127.0.0.1:${BUZZ_MEMORY_PORT:-18006}:8006"
    volumes:
      - memory-vault:/data
      - memory-index:/data/index
    secrets:
      - memory-replication-tokens
    networks:
      - buzz-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c 'import json,urllib.request; t=json.load(open(\"/run/secrets/memory-replication-tokens\", encoding=\"utf-8\"))[\"read\"]; q=urllib.request.Request(\"http://127.0.0.1:8006/replication/readiness\", headers={\"Authorization\":\"Bearer \"+t,\"Accept\":\"application/json\"}); r=urllib.request.build_opener(urllib.request.ProxyHandler({})).open(q, timeout=3); v=json.load(r); assert v[\"status\"]==\"ready\" and v[\"node_id\"]==\"${BUZZ_MEMORY_NODE_ID:-node:macbook-command}\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "memory"
      com.buzz.env: "command-memory"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: buzz-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - buzz-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "prometheus"
      com.buzz.env: "dev"
    restart: unless-stopped

volumes:
  postgres-data:
    name: buzz-postgres-data
    labels:
      com.buzz.volume: "postgres"
  minio-data:
    name: buzz-minio-data
    labels:
      com.buzz.volume: "minio"
  prometheus-data:
    name: buzz-prometheus-data
    labels:
      com.buzz.volume: "prometheus"
  memory-vault:
    name: buzz-memory-vault
    labels:
      com.buzz.volume: "memory-vault"
      com.buzz.backup: "canonical"
  memory-index:
    name: buzz-memory-index
    labels:
      com.buzz.volume: "memory-index"
      com.buzz.backup: "rebuildable"

networks:
  buzz-net:
    name: buzz-net
    driver: bridge
    labels:
      com.buzz.network: "dev"

secrets:
  memory-replication-tokens:
    file: ${BUZZ_MEMORY_REPLICATION_TOKENS_FILE:-.local/memory-replication-tokens.json}
