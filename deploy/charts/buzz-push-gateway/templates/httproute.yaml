{{- if .Values.httpRoute.enabled }}
{{- $gatewayURL := urlParse (required "gatewayOrigin is required" .Values.gatewayOrigin) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "push.name" . }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "gatewayOrigin must include a hostname" $gatewayURL.host | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: {{ include "push.name" . }}, port: {{ .Values.service.port }} }
{{- end }}
