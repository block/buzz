# Required environment-owned values are deliberately invalid/empty here. A
# production renderer must inject all of them; CI proves omission fails.
image:
  tag: ""
  digest: ""
gatewayOrigin: ""
profiles:
  dogfood:
    appAttestAppId: ""
httpRoute:
  # Keep disabled when the platform already routes the configured gateway
  # origin to this Service. Gateway API users enable it and inject a parentRef.
  enabled: false
  parentRefs: []
networkPolicy:
  apnsEgressCidrs:
    - 0.0.0.0/0
  postgresEgressCidrs: []
