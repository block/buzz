replicaCount: 2
image:
  repository: ghcr.io/block/buzz-push-gateway
  # `main` is published by the push-gateway lane on every main push.
  tag: main
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
existingSecret: buzz-push-gateway
# DDL-capable credentials are used only by the pre-install/pre-upgrade migration
# Job. Runtime DATABASE_URL in existingSecret should have DML-only privileges.
migration:
  # Applies only to migration Pods, independently of runtime podAnnotations.
  podAnnotations: {}
  existingSecret: buzz-push-gateway-migrations
  databaseUrlKey: DATABASE_URL
  # Existing LOGIN role used by runtime DATABASE_URL. Migrations grant it only
  # CONNECT plus DML on the six gateway tables in this dedicated database.
  runtimeDatabaseRole: buzz_push_gateway_runtime
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
# Routing origin used only when httpRoute.enabled=true. Not passed to the binary.
gatewayOrigin: ""
maxGrantLifetimeSeconds: 2592000
application:
  # Production MUST override this with the exact Apple TEAMID.bundle-id.
  appAttestAppId: TEAMID.com.example.buzz
  apnsTopic: com.example.buzz
  apnsEnvironment: production
  apnsCert:
    secretName: buzz-push-gateway
    secretKey: apns-identity.pem
# Android is off unless enabled. Enabling it needs the package, at least one
# signing certificate digest and the Firebase project and service account.
android:
  enabled: false
  # Exact application package the attestation must name.
  packageName: com.example.buzz
  # SHA-256 digests (64 hex characters each) of the app's signing certificates.
  signingCertDigests: []
  # Verified boot keys (SHA-256 digests, 64 hex characters each) accepted when
  # the hardware reports a self-signed boot state. Empty accepts stock Android
  # only. Add the published keys of a custom operating system to support it.
  bootKeyDigests: []
  # Seconds the attestation revocation list may go without a successful refresh
  # before Android enrollment fails closed.
  revocationGraceSeconds: 604800
  fcmProjectId: example-project
  # Secret holding Google's credential JSON: a service account key, or an AWS
  # workload identity federation config (type external_account) for keyless
  # access. Federation also needs AWS_REGION and AWS credentials in the pod.
  # As shipped, the chart supports IRSA, whose webhook injects both. EKS Pod
  # Identity also needs a region and a NetworkPolicy egress rule to the agent
  # (169.254.170.23/32, TCP 80), which this chart does not add.
  fcmCredentials:
    secretName: buzz-push-gateway
    secretKey: fcm-credentials.json
  # Optional PEM bundle replacing the built-in Google attestation roots, for a
  # reviewed root rollout. Empty secretName keeps the built-in roots.
  attestationRoots:
    secretName: ""
    secretKey: android-attestation-roots.pem
# Rate limit on signed installation calls, per attested key and replica.
signedCallRateLimit:
  windowSeconds: 60
  maxCalls: 30
appAttestRoot:
  secretName: buzz-push-gateway
  secretKey: app-attest-root.pem
service:
  port: 8080
# Optional Deployment metadata, independent of runtime and migration Pods.
# The chart owns buzz.block.xyz/release-namespace and external-network-policy.
deploymentAnnotations: {}
podAnnotations: {}
httpRoute:
  # Disabled by default so a generic install cannot claim an unattached route.
  # Enable only when this chart owns a Gateway API route. Environments with an
  # existing ingress or service mesh route should keep this disabled.
  enabled: false
  parentRefs: []
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  # Parent chart must supply this named replacement when enabled is false.
  externalPolicyName: ""
  enabled: true
  # Kubernetes NetworkPolicy cannot allow DNS names. Production operators must
  # narrow these CIDRs to their PostgreSQL/NAT destinations where supported.
  apnsEgressCidrs: [0.0.0.0/0]
  # Override with the actual database network. This example private range is
  # intentionally separate from broad APNs HTTPS egress.
  postgresEgressCidrs: [10.0.0.0/8]
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # Scoped ingress to the private metrics port (8081). Off by default so 8081
  # has no pod ingress at all; enable alongside podMonitor or an external
  # annotation-discovered scraper and name its namespace/pod so reachability
  # stays narrow.
  monitoring:
    enabled: false
    namespaceSelector: {}
    podSelector: {}
# Prometheus-operator PodMonitor scraping the private /metrics on port 8081.
# Off by default; requires networkPolicy.monitoring to also be enabled.
podMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
# Prometheus-operator alerting rules. Off by default.
prometheusRule:
  enabled: false
  labels: {}
  # Retryable-outcome fraction (0..1] that fires PushGatewayHighApnsRetryRate.
  apnsRetryRatioThreshold: 0.25
  # Minimum APNs attempts in the 10m window before the retry-ratio alert can
  # fire, so a couple of retries at trivial volume cannot trip it.
  apnsRetryMinSamples: 20
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: buzz-push-gateway

# Runtime-only mesh integration. Migration settings remain separate.
podLabels: {}
serviceAccountName: ""
terminationGracePeriodSeconds: 60
