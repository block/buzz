      s3.bucket: buzz-media-example
      s3.accessKey: test
      s3.secretKey: test
      operatorJobs.deletionDrain.enabled: true
      image.tag: sha-abcdef1
      image.digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
      operatorJobs.deletionDrain.podLabels:
        tags.datadoghq.com/env: staging
