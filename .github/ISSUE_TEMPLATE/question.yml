name: ❓ Question
description: Ask a question about using or contributing to Buzz
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're happy to help. Please check the [README](https://github.com/block/buzz#readme), [CONTRIBUTING.md](https://github.com/block/buzz/blob/main/CONTRIBUTING.md), and [open issues](https://github.com/block/buzz/issues) first — your answer may already be there.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe what you're trying to accomplish or understand.
      placeholder: "I'm trying to..."
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried or looked at?
      description: Share what you've already attempted or where you've looked. This helps us give a more targeted answer.
      placeholder: "I looked at... / I tried... but..."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      description: OS, Buzz version, or other relevant context.
      placeholder: "e.g. macOS 14, Buzz 0.4.2"
