name: 💡 Feature Request
description: Propose a new feature or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please [search open issues and PRs](https://github.com/block/buzz/issues?q=is%3Aopen) — someone may have already proposed or started work on the same idea.

        Features need an issue with maintainer acknowledgment before a PR. Opening this issue is the first step.

  - type: input
    id: existing
    attributes:
      label: Closest existing issue or PR
      description: "What's the most similar open issue or PR you found? Write the number, or \"none found\"."
      placeholder: "#1234 or none found"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who runs into it and when?
      placeholder: "As a [user type], I often need to [do X] but currently have to [workaround Y], which is frustrating because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see. Concrete examples, mockups, or API sketches are very helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why do you prefer this one?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, prior art in other tools, or anything else that helps.
