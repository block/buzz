name: Windows Fork Integration Build
run-name: Windows Fork Integration ${{ inputs.build_request_event_id && 'BW' || 'manual' }} @ ${{ inputs.freeze_sha }}

# Fork-only unsigned NSIS build for explicit testing. Never submit upstream.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Frozen release label from the Relay release set (BW only; leave empty for manual build)
        required: false
        type: string
      freeze_sha:
        description: Frozen canonical Relay commit SHA
        required: true
        type: string
      build_request_event_id:
        description: BW build-request event ID (BW only; leave empty for manual build)
        required: false
        type: string
      pipeline_event_id:
        description: BW release-pipeline event ID (BW only; leave empty for manual build)
        required: false
        type: string
      expected_workflow_sha256:
        description: SHA-256 of this committed workflow file (BW only; leave empty for manual build)
        required: false
        type: string
      expected_manifest_schema_sha256:
        description: SHA-256 of the committed manifest schema (BW only; leave empty for manual build)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-client
  cancel-in-progress: false

env:
  CANONICAL_WINDOWS_BRANCH: windows
  # Latest successful build from the old canonical Windows stream.
  WINDOWS_BOOTSTRAP_SHA: 83afea0a1549410a8f7effa12ceed0f7b13234e6
  WORKFLOW_PATH: .github/workflows/windows-fork-integration.yml
  MANIFEST_SCHEMA_PATH: docs/nips/BW_WINDOWS_NSIS_MANIFEST_V1.schema.json

jobs:
  validate-cumulative-lineage:
    name: Validate dispatch contract and cumulative Windows client lineage
    runs-on: ubuntu-latest
    outputs:
      workflow_sha256: ${{ steps.contract.outputs.workflow_sha256 }}
      manifest_schema_sha256: ${{ steps.contract.outputs.manifest_schema_sha256 }}
      generator_sha256: ${{ steps.contract.outputs.generator_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manual or BW source
        shell: bash
        env:
          FREEZE_SHA: ${{ inputs.freeze_sha }}
          BUILD_REQUEST_EVENT_ID: ${{ inputs.build_request_event_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          PIPELINE_EVENT_ID: ${{ inputs.pipeline_event_id }}
          EXPECTED_WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
          EXPECTED_MANIFEST_SCHEMA_SHA256: ${{ inputs.expected_manifest_schema_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == Jari81/buzz ]]
          [[ "$FREEZE_SHA" =~ ^[0-9a-f]{40}$ && "$FREEZE_SHA" == "$GITHUB_SHA" ]]
          if [[ -n "$BUILD_REQUEST_EVENT_ID" ]]; then
            [[ "$GITHUB_REF_NAME" == windows ]]
            # Full BW metadata and pinned digest checks follow; no fallback.
          else
            [[ "$GITHUB_REF_NAME" == windows || "$GITHUB_REF_NAME" == windows-integration ]]
            [[ -z "$RELEASE_ID$PIPELINE_EVENT_ID$EXPECTED_WORKFLOW_SHA256$EXPECTED_MANIFEST_SCHEMA_SHA256" ]]
          fi

      - name: Validate dispatch bindings
        if: inputs.build_request_event_id != ''
        id: contract
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          FREEZE_SHA: ${{ inputs.freeze_sha }}
          BUILD_REQUEST_EVENT_ID: ${{ inputs.build_request_event_id }}
          PIPELINE_EVENT_ID: ${{ inputs.pipeline_event_id }}
          EXPECTED_WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
          EXPECTED_MANIFEST_SCHEMA_SHA256: ${{ inputs.expected_manifest_schema_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/windows_build_manifest.py preflight \
            --release-id "$RELEASE_ID" \
            --freeze-sha "$FREEZE_SHA" \
            --build-request-event-id "$BUILD_REQUEST_EVENT_ID" \
            --pipeline-event-id "$PIPELINE_EVENT_ID" \
            --github-sha "$GITHUB_SHA" \
            --github-repository "$GITHUB_REPOSITORY" \
            --workflow-file "$WORKFLOW_PATH" \
            --manifest-schema-file "$MANIFEST_SCHEMA_PATH" \
            --expected-workflow-sha256 "$EXPECTED_WORKFLOW_SHA256" \
            --expected-manifest-schema-sha256 "$EXPECTED_MANIFEST_SCHEMA_SHA256" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve previous successful Windows build
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_sha=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-fork-integration.yml/runs?branch=${CANONICAL_WINDOWS_BRANCH}&status=success&per_page=20" \
              --jq '.workflow_runs[].head_sha' \
              | head -n 1
          )
          if [[ -z "$previous_sha" ]]; then
            previous_sha="$WINDOWS_BOOTSTRAP_SHA"
            echo "Using old-stream bootstrap baseline $previous_sha"
          fi
          git fetch --no-tags origin "$previous_sha"
          echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"
          # Keep both the historical integration stream and temporary canary cumulative.
          for lane in 'windows-fork-integration.yml:windows-integration' 'windows-canary.yml:windows'; do
            workflow="${lane%%:*}"
            branch="${lane#*:}"
            baseline=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${branch}&status=success&per_page=1" --jq '.workflow_runs[].head_sha')
            if [[ -n "$baseline" ]]; then
              git fetch --no-tags origin "$baseline"
              scripts/verify-windows-client-lineage.sh "$baseline" "$GITHUB_SHA" "$CANONICAL_WINDOWS_BRANCH"
            fi
          done

      - name: Verify cumulative lineage and retained client surfaces
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          scripts/verify-windows-client-lineage.sh \
            "$PREVIOUS_SHA" "$GITHUB_SHA" "$CANONICAL_WINDOWS_BRANCH"
          scripts/check-windows-client-contract.sh "$GITHUB_SHA"
          python3 -m unittest -q scripts.test_windows_integration_manual scripts.test_windows_workflow_contract scripts.test_windows_build_manifest

  build:
    name: Build unsigned Windows installer and bound manifest
    needs: validate-cumulative-lineage
    if: github.repository == 'Jari81/buzz'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Derive test-only version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-fork.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building unsigned test version $VERSION from $GITHUB_SHA"

      - name: Patch test-only version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri
          cargo update --workspace

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          shared-key: windows-fork-integration

      - name: Generate non-updating bundle config
        shell: bash
        run: node -e "require('fs').writeFileSync('desktop/src-tauri/tauri.canary.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build unsigned Windows NSIS installer
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.canary.conf.json

      - name: Stage installer and generate bound manifest
        if: inputs.build_request_event_id != ''
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          FREEZE_SHA: ${{ inputs.freeze_sha }}
          BUILD_REQUEST_EVENT_ID: ${{ inputs.build_request_event_id }}
          PIPELINE_EVENT_ID: ${{ inputs.pipeline_event_id }}
          EXPECTED_WORKFLOW_SHA256: ${{ needs.validate-cumulative-lineage.outputs.workflow_sha256 }}
          EXPECTED_MANIFEST_SCHEMA_SHA256: ${{ needs.validate-cumulative-lineage.outputs.manifest_schema_sha256 }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          ARTIFACT_DIR="windows-build-artifact"
          python3 scripts/windows_build_manifest.py generate \
            --installer-dir "$BUNDLE_DIR/nsis" \
            --output-dir "$ARTIFACT_DIR" \
            --release-id "$RELEASE_ID" \
            --freeze-sha "$FREEZE_SHA" \
            --build-request-event-id "$BUILD_REQUEST_EVENT_ID" \
            --pipeline-event-id "$PIPELINE_EVENT_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$WORKFLOW_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --workflow-file "$WORKFLOW_PATH" \
            --manifest-schema-file "$MANIFEST_SCHEMA_PATH" \
            --expected-workflow-sha256 "$EXPECTED_WORKFLOW_SHA256" \
            --expected-manifest-schema-sha256 "$EXPECTED_MANIFEST_SCHEMA_SHA256"
          python3 scripts/windows_build_manifest.py validate \
            --manifest "$ARTIFACT_DIR/mybuzz-windows-build-manifest.json" \
            --artifact-dir "$ARTIFACT_DIR" \
            --workflow-file "$WORKFLOW_PATH" \
            --manifest-schema-file "$MANIFEST_SCHEMA_PATH"

      - name: Stage manual test installer
        if: inputs.build_request_event_id == ''
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          files = list(Path("desktop/src-tauri/target").glob(os.environ["TARGET"] + "/release/bundle/nsis/*.exe"))
          if len(files) != 1:
              raise SystemExit(f"Expected exactly one NSIS installer, found {len(files)}")
          target = Path("windows-build-artifact")
          target.mkdir(exist_ok=False)
          installer = target / files[0].name
          shutil.copyfile(files[0], installer)
          receipt = {
              "kind": "manual-test-only", "unsigned": True, "product_accepted": False,
              "commit": os.environ["GITHUB_SHA"], "ref": os.environ["GITHUB_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "filename": installer.name, "bytes": installer.stat().st_size,
              "sha256": hashlib.sha256(installer.read_bytes()).hexdigest(),
          }
          (target / "manual-test-build.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload unsigned installer and bound manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.build_request_event_id && format('buzz-windows-{0}', github.sha) || format('buzz-windows-integration-{0}', github.sha) }}
          path: windows-build-artifact
          if-no-files-found: error
          retention-days: 7
