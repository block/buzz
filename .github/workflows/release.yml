name: Release Buzz desktop

# Builds, signs, and publishes a new Buzz desktop release whenever a version
# tag (e.g. `v0.5.6-k2v5`) is pushed. Existing installs with the Tauri
# updater configured (see desktop/src-tauri/tauri.conf.json's
# `plugins.updater.endpoints`) poll this repo's GitHub Releases and prompt
# users to update automatically once a release lands here — no more manually
# building on a dev machine and hand-distributing the installer.
#
# Scoped to Windows only for now, matching how this fork is actually being
# distributed today (k2alpha is a Windows team). To add macOS/Linux builds
# later, add entries to the `matrix.include` list below — the rest of the
# job (signing, publishing) is platform-agnostic and doesn't need to change.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required so the updater manifest (`latest.json`) and installers
          # are cryptographically signed the same way `tauri signer generate`
          # produced the keypair configured in tauri.conf.json's
          # `plugins.updater.pubkey`. The private half of that keypair must
          # be added as a repo secret named TAURI_SIGNING_PRIVATE_KEY before
          # this workflow can run successfully — see the PR/setup notes for
          # the one-time manual step.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Buzz ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md or the in-app What's New screen for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
