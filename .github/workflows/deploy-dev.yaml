name: Deploy Dev
run-name: buzz dev ⇐ ${{ github.ref_name }}

# DO-4081: builds the relay image and pushes it to the dev ECR repo (buzz-dev).
# The ArgoCD Application (DO-4082, dev-infrastructure) consumes the image URI
# from the Slack thread / job log; this workflow does not touch meq-eks-workloads.
# Manual trigger from a non-main branch (main would target a buzz-prod repo that
# config/aws/ecr.yaml does not create).

on:
  workflow_dispatch:

concurrency:
  group: deploy-buzz-dev
  cancel-in-progress: false

env:
  MEQ_ENV: dev
  AWS_REGION: us-east-1
  SLACK_CHANNEL_ID: C01879LTTJQ

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.vars.outputs.branch }}
      job-url: ${{ steps.vars.outputs.job-url }}
      slack-thread: ${{ steps.slack.outputs.ts }}
    steps:
      - name: Configure variables
        id: vars
        run: |
          echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "job-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Start Slack thread
        id: slack
        uses: meQuilibrium/github-actions/slack-deploy-notify@main
        with:
          deployment-name: buzz dev
          branch: ${{ steps.vars.outputs.branch }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          button-link: ${{ steps.vars.outputs.job-url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATOPS_SLACK_BOT_TOKEN }}

  build:
    name: Build and Deploy
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and push image
        uses: meQuilibrium/github-actions/build-and-deploy-k8s@main
        with:
          project-name: buzz
          application-type: rust
          MEQ_ENV: ${{ env.MEQ_ENV }}
          APP_ENV: prod
          AWS_REGION: ${{ env.AWS_REGION }}
          slack-channel-id: ${{ env.SLACK_CHANNEL_ID }}
          slack-thread: ${{ needs.setup.outputs.slack-thread }}
          chatops-slack-bot-token: ${{ secrets.CHATOPS_SLACK_BOT_TOKEN }}
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          # Empty skips the meq-eks-workloads imageTag bump.
          kubernetes-manifest-editor-github-token: ''


      - name: "Notify Slack: Build failed"
        if: ${{ failure() }}
        uses: meQuilibrium/github-actions/slack-deploy-notify@main
        with:
          prefix: ':failure:'
          deployment-name: buzz dev
          branch: ${{ needs.setup.outputs.branch }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          button-link: ${{ needs.setup.outputs.job-url }}
          thread-id: ${{ needs.setup.outputs.slack-thread }}
          thread-message: "Build failed. <${{ needs.setup.outputs.job-url }}|Open Job> for details."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATOPS_SLACK_BOT_TOKEN }}

      - name: "Notify Slack: Build cancelled"
        if: ${{ cancelled() }}
        uses: meQuilibrium/github-actions/slack-deploy-notify@main
        with:
          prefix: ':failure:'
          deployment-name: buzz dev
          branch: ${{ needs.setup.outputs.branch }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          button-link: ${{ needs.setup.outputs.job-url }}
          thread-id: ${{ needs.setup.outputs.slack-thread }}
          thread-message: "Build cancelled"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATOPS_SLACK_BOT_TOKEN }}
