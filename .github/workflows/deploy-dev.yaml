name: Deploy Dev
run-name: buzz dev ⇐ ${{ github.ref_name }}

# DO-4081: builds the relay image and pushes it to the dev ECR repo (buzz-dev).
# The ArgoCD Application (DO-4082, dev-infrastructure) consumes the image URI
# from the Slack thread / job log; this workflow does not touch meq-eks-workloads.
# There is no buzz prod: every push to main builds and pushes to buzz-dev.
# Other branches can be built manually via workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-buzz-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SLACK_CHANNEL_ID: C01879LTTJQ

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.vars.outputs.branch }}
      job-url: ${{ steps.vars.outputs.job-url }}
      slack-thread: ${{ steps.slack.outputs.ts }}
    steps:
      - name: Configure variables
        id: vars
        run: |
          echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "job-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Start Slack thread
        id: slack
        uses: meQuilibrium/github-actions/slack-deploy-notify@main
        with:
          deployment-name: buzz dev
          branch: ${{ steps.vars.outputs.branch }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          button-link: ${{ steps.vars.outputs.job-url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATOPS_SLACK_BOT_TOKEN }}

  build:
    name: Build and Push
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository
        run: |
          aws cloudformation deploy \
            --stack-name buzz-ecr-dev \
            --template-file config/aws/ecr.yaml \
            --no-fail-on-empty-changeset \
            --parameter-overrides CLASS=dev

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: image
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          tag="${branch}-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "uri=${{ steps.login-ecr.outputs.registry }}/buzz-dev:$tag" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name buzz-dev --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.exists == 'false'

      - name: Build and push
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image
        run: |
          echo "Image: ${{ steps.image.outputs.uri }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Notify Slack: Image pushed"
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.CHATOPS_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: "Pushed image `${{ steps.image.outputs.uri }}`"
            thread_ts: "${{ needs.setup.outputs.slack-thread }}"

      - name: "Notify Slack: Build failed"
        if: ${{ failure() }}
        uses: meQuilibrium/github-actions/slack-deploy-notify@main
        with:
          prefix: ':failure:'
          deployment-name: buzz dev
          branch: ${{ needs.setup.outputs.branch }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          button-link: ${{ needs.setup.outputs.job-url }}
          thread-id: ${{ needs.setup.outputs.slack-thread }}
          thread-message: "Build failed. <${{ needs.setup.outputs.job-url }}|Open Job> for details."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATOPS_SLACK_BOT_TOKEN }}

      - name: "Notify Slack: Build cancelled"
        if: ${{ cancelled() }}
        uses: meQuilibrium/github-actions/slack-deploy-notify@main
        with:
          prefix: ':failure:'
          deployment-name: buzz dev
          branch: ${{ needs.setup.outputs.branch }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          button-link: ${{ needs.setup.outputs.job-url }}
          thread-id: ${{ needs.setup.outputs.slack-thread }}
          thread-message: "Build cancelled"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATOPS_SLACK_BOT_TOKEN }}
