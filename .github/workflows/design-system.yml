name: Design system
on:
  pull_request:
    paths: ['desktop-next/**', 'packages/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/design-system.yml']
  push:
    branches: [design-system]
    paths: ['desktop-next/**', 'packages/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/design-system.yml']
permissions:
  contents: read
jobs:
  design-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - run: pnpm install --filter buzz-desktop-next... --frozen-lockfile
      - run: pnpm --filter buzz-desktop-next check
      - run: pnpm --filter buzz-desktop-next build
      - run: pnpm exec biome check packages/ui packages/design-tokens
      - run: pnpm --filter buzz-desktop-next exec playwright install --with-deps chromium
      - run: pnpm --filter buzz-desktop-next exec playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buzz-design-system
          path: desktop-next/dist
          retention-days: 14
