name: Signed macOS Canary

# Produces a signed and notarized Apple Silicon DMG from main without creating
# a tag, GitHub Release, or auto-updater artifact. The DMG is available only as
# a short-lived GitHub Actions artifact for explicit testing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed macOS canary
    if: github.repository == 'block/buzz'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # required by block/apple-codesign-action for OIDC
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Signed canary builds must run from main; got $SOURCE_REF"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Derive canary version
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-test.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building canary version $VERSION from $GITHUB_SHA"

      - name: Patch canary version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Resolve native toolchain identity
        id: native_toolchain
        run: echo "id=$(scripts/desktop-native-toolchain-id.sh macos)" >> "$GITHUB_OUTPUT"

      # Compute this after cargo update so the key describes the graph that is
      # actually compiled. The helper normalizes only Buzz Desktop's release
      # version, allowing a canary to warm an otherwise identical tag build.
      - name: Compute exact release cache key
        id: rust_cache_key
        env:
          NATIVE_TOOLCHAIN_ID: ${{ steps.native_toolchain.outputs.id }}
        run: |
          KEY=$(scripts/desktop-release-cache-key.py \
            --platform "$RUNNER_OS" \
            --target aarch64-apple-darwin \
            --features mesh-llm \
            --native-inputs "$NATIVE_TOOLCHAIN_ID")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Release cache key: $KEY"

      - name: Restore exact release Cargo cache
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Generate non-updating bundle config
        run: |
          cat > desktop/src-tauri/tauri.canary.conf.json <<'JSON'
          {
            "bundle": {
              "macOS": {
                "minimumSystemVersion": "10.15"
              },
              "createUpdaterArtifacts": false
            }
          }
          JSON

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      # Mesh rev derived from Cargo.lock (no lockstep edit on dep bump); cache key tracks it.
      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"

      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$MESH_REV_SHORT" -type d -name "$MESH_REV_SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $MESH_REV_SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build unsigned Tauri app
        run: cd desktop && pnpm tauri build --verbose --no-sign --features mesh-llm --config src-tauri/tauri.canary.conf.json
        env:
          BUZZ_BUILD_REQUIRE_HEARTBEAT_PREFLIGHT_SIDECAR: "1"
          BUZZ_BUILD_HEARTBEAT_HARNESS_MACOS_TEAM_IDENTIFIER: EYF346PHUG
          BUZZ_BUILD_SOURCE_REVISION: ${{ github.sha }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Locate unsigned DMG
        id: unsigned
        run: |
          DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Set DMG Finder label text size
        env:
          DMG_PATH: ${{ steps.unsigned.outputs.dmg }}
        run: desktop/scripts/set-dmg-finder-text-size.sh "$DMG_PATH" 14

      # mdx-ios-codesign-helper discovers this file by its exact lowercase basename.
      - name: Stage signing entitlements
        run: cp desktop/src-tauri/Entitlements.plist "${RUNNER_TEMP}/entitlements.plist"

      - name: Codesign and notarize
        id: codesign
        uses: block/apple-codesign-action@679535d1ab7c5a7c18e6f9afcba3464512cc3dde # v1.1.0
        with:
          osx-codesign-role: ${{ secrets.OSX_CODESIGN_ROLE }}
          codesign-s3-bucket: ${{ secrets.CODESIGN_S3_BUCKET }}
          unsigned-artifact-path: ${{ steps.unsigned.outputs.dmg }}
          entitlements-plist-path: ${{ runner.temp }}/entitlements.plist
          artifact-name: buzz-canary-${{ github.sha }}-${{ github.run_id }}-arm64

      - name: Verify signed app
        env:
          SIGNED_APP_ZIP: ${{ steps.codesign.outputs.signed-artifact-path }}
        run: |
          set -euo pipefail
          EXTRACT_DIR="${RUNNER_TEMP}/signed-app-extract"
          rm -rf "$EXTRACT_DIR" && mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$SIGNED_APP_ZIP" "$EXTRACT_DIR"
          codesign --verify --deep --strict --verbose=2 "$EXTRACT_DIR/Buzz.app"
          spctl --assess --type execute --verbose=4 "$EXTRACT_DIR/Buzz.app"
          desktop/scripts/verify-macos-entitlements.sh "$EXTRACT_DIR/Buzz.app"

      - name: Verify trusted heartbeat harness installation
        id: verified_harness
        env:
          SIGNED_APP_ZIP: ${{ steps.codesign.outputs.signed-artifact-path }}
          SIGNED_DMG: ${{ steps.codesign.outputs.signed-dmg-path }}
        run: |
          set -euo pipefail
          EXTRACT_DIR="${RUNNER_TEMP}/trusted-heartbeat-install"
          rm -rf "$EXTRACT_DIR" && mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$SIGNED_APP_ZIP" "$EXTRACT_DIR"
          SOURCE="$EXTRACT_DIR/Buzz.app/Contents/MacOS/buzz-acp"
          SYSTEM_PARENT="/Library/Application Support"
          TARGET_PARENT="/Library/Application Support/Buzz"
          TARGET_DIRECTORY="$TARGET_PARENT/TrustedHeartbeat"
          TARGET="$TARGET_DIRECTORY/buzz-acp"
          TEAM_IDENTIFIER="EYF346PHUG"
          APP_REQUIREMENT="identifier \"xyz.block.buzz.app\" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = \"$TEAM_IDENTIFIER\""
          HARNESS_REQUIREMENT="identifier \"buzz-acp\" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = \"$TEAM_IDENTIFIER\""
          codesign --verify --deep --strict --verbose=2 -R="$APP_REQUIREMENT" "$EXTRACT_DIR/Buzz.app"
          codesign --verify --strict --verbose=2 -R="$HARNESS_REQUIREMENT" "$SOURCE"
          test ! -L "$SOURCE"
          BUZZ_BUILD_REQUIRE_HEARTBEAT_PREFLIGHT_SIDECAR=1 \
            BUZZ_BUILD_HEARTBEAT_HARNESS_MACOS_TEAM_IDENTIFIER=EYF346PHUG \
            BUZZ_BUILD_SOURCE_REVISION="$GITHUB_SHA" \
            cargo run --quiet --manifest-path desktop/src-tauri/Cargo.toml \
              --release --features harness-verifier \
              --bin verify-heartbeat-harness-identity -- "$SOURCE"
          SIGNED_DMG_SHA256=$(shasum -a 256 "$SIGNED_DMG" | awk '{print $1}')
          hdiutil verify "$SIGNED_DMG"
          spctl -a -t open --context context:primary-signature -v "$SIGNED_DMG"
          xcrun stapler validate "$SIGNED_DMG"
          MOUNT_POINT=$(mktemp -d "${RUNNER_TEMP}/signed-canary-dmg-mount.XXXXXX")
          DMG_MOUNTED=0
          cleanup_dmg() {
            if [[ "$DMG_MOUNTED" = 1 ]]; then
              hdiutil detach "$MOUNT_POINT"
            fi
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup_dmg EXIT HUP INT TERM
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$SIGNED_DMG" >/dev/null
          DMG_MOUNTED=1
          DMG_APP="$MOUNT_POINT/Buzz.app"
          DMG_HARNESS="$DMG_APP/Contents/MacOS/buzz-acp"
          BUZZ_BUILD_REQUIRE_HEARTBEAT_PREFLIGHT_SIDECAR=1 \
            BUZZ_BUILD_HEARTBEAT_HARNESS_MACOS_TEAM_IDENTIFIER=EYF346PHUG \
            BUZZ_BUILD_SOURCE_REVISION="$GITHUB_SHA" \
            cargo run --quiet --manifest-path desktop/src-tauri/Cargo.toml \
              --release --features harness-verifier \
              --bin verify-heartbeat-harness-identity -- "$DMG_HARNESS"
          codesign --verify --deep --strict --verbose=2 -R="$APP_REQUIREMENT" "$DMG_APP"
          codesign --verify --strict --verbose=2 -R="$HARNESS_REQUIREMENT" "$DMG_HARNESS"
          codesign -dv --verbose=4 "$DMG_HARNESS" 2>&1 | grep -Eq 'flags=0x[[:xdigit:]]+\([^)]*runtime[^)]*\)'
          test -z "$(codesign -d --entitlements - --xml "$DMG_HARNESS" 2>/dev/null)"
          test "$("$DMG_HARNESS" heartbeat-preflight-capability)" = \
            '{"kind":"buzz_acp_heartbeat_preflight_capability","protocol_version":1,"build_capability":"buzz-acp-source-witness-gateway-v1"}'
          hdiutil detach "$MOUNT_POINT"
          DMG_MOUNTED=0
          rm -rf "$MOUNT_POINT"
          trap - EXIT HUP INT TERM
          test "$(shasum -a 256 "$SIGNED_DMG" | awk '{print $1}')" = "$SIGNED_DMG_SHA256"
          echo "dmg_sha256=$SIGNED_DMG_SHA256" >> "$GITHUB_OUTPUT"
          SOURCE_SHA=$(shasum -a 256 "$SOURCE" | awk '{print $1}')
          test ! -L "$SYSTEM_PARENT"
          test "$(stat -f '%u %Lp %HT' "$SYSTEM_PARENT")" = "0 755 Directory"
          # Fixed path; `ls -lde` is used only to count ACL rows.
          # shellcheck disable=SC2012
          test "$(ls -lde "$SYSTEM_PARENT" | wc -l | tr -d ' ')" = "1"
          if [[ ! -e "$TARGET_PARENT" && ! -L "$TARGET_PARENT" ]]; then
            sudo /usr/bin/install -d -o root -g wheel -m 0755 "$TARGET_PARENT"
          fi
          test ! -L "$TARGET_PARENT"
          test "$(stat -f '%u %Lp %HT' "$TARGET_PARENT")" = "0 755 Directory"
          sudo /bin/chmod -N "$TARGET_PARENT"
          sudo /usr/sbin/chown root:wheel "$TARGET_PARENT"
          sudo /bin/chmod 0755 "$TARGET_PARENT"
          if [[ ! -e "$TARGET_DIRECTORY" && ! -L "$TARGET_DIRECTORY" ]]; then
            sudo /usr/bin/install -d -o root -g wheel -m 0755 "$TARGET_DIRECTORY"
          fi
          test ! -L "$TARGET_DIRECTORY"
          test "$(stat -f '%u %Lp %HT' "$TARGET_DIRECTORY")" = "0 755 Directory"
          sudo /bin/chmod -N "$TARGET_DIRECTORY"
          sudo /usr/sbin/chown root:wheel "$TARGET_DIRECTORY"
          sudo /bin/chmod 0755 "$TARGET_DIRECTORY"
          # Fixed paths; `ls -lde` is used only to count ACL rows.
          # shellcheck disable=SC2012
          test "$(ls -lde "$TARGET_PARENT" | wc -l | tr -d ' ')" = "1"
          # shellcheck disable=SC2012
          test "$(ls -lde "$TARGET_DIRECTORY" | wc -l | tr -d ' ')" = "1"
          TARGET_NEW=$(sudo /usr/bin/mktemp "$TARGET_DIRECTORY/.buzz-acp.XXXXXX")
          case "$TARGET_NEW" in
            "$TARGET_DIRECTORY"/.buzz-acp.*) ;;
            *) exit 1 ;;
          esac
          cleanup() {
            if [[ -n "${TARGET_NEW:-}" ]]; then
              sudo /bin/rm -f "$TARGET_NEW"
            fi
          }
          trap cleanup EXIT HUP INT TERM
          cat "$SOURCE" | sudo /usr/bin/tee "$TARGET_NEW" >/dev/null
          sudo /bin/chmod -N "$TARGET_NEW"
          sudo /usr/sbin/chown root:wheel "$TARGET_NEW"
          sudo /bin/chmod 0755 "$TARGET_NEW"
          TARGET_SHA=$(shasum -a 256 "$TARGET_NEW" | awk '{print $1}')
          test "$SOURCE_SHA" = "$TARGET_SHA"
          codesign --verify --strict --verbose=2 -R="$HARNESS_REQUIREMENT" "$TARGET_NEW"
          codesign -dv --verbose=4 "$TARGET_NEW" 2>&1 | grep -Eq 'flags=0x[[:xdigit:]]+\([^)]*runtime[^)]*\)'
          test -z "$(codesign -d --entitlements - --xml "$TARGET_NEW" 2>/dev/null)"
          # Fixed path; `ls -lde` is used only to count ACL rows.
          # shellcheck disable=SC2012
          test "$(ls -lde "$TARGET_NEW" | wc -l | tr -d ' ')" = "1"
          if [[ -d "$TARGET" && ! -L "$TARGET" ]]; then
            exit 1
          fi
          sudo /bin/mv -fh "$TARGET_NEW" "$TARGET"
          TARGET_NEW=""
          test ! -L "$TARGET"
          test "$(stat -f '%u %Lp %HT' "$TARGET")" = "0 755 Regular File"
          test "$SOURCE_SHA" = "$(shasum -a 256 "$TARGET" | awk '{print $1}')"
          codesign --verify --strict --verbose=2 -R="$HARNESS_REQUIREMENT" "$TARGET"
          codesign -dv --verbose=4 "$TARGET" 2>&1 | grep -Eq 'flags=0x[[:xdigit:]]+\([^)]*runtime[^)]*\)'
          test -z "$(codesign -d --entitlements - --xml "$TARGET" 2>/dev/null)"
          # Fixed path; `ls -lde` is used only to count ACL rows.
          # shellcheck disable=SC2012
          test "$(ls -lde "$TARGET" | wc -l | tr -d ' ')" = "1"
          test "$("$TARGET" heartbeat-preflight-capability)" = \
            '{"kind":"buzz_acp_heartbeat_preflight_capability","protocol_version":1,"build_capability":"buzz-acp-source-witness-gateway-v1"}'

      - name: Stage signed DMG
        id: artifact
        env:
          SIGNED_DMG: ${{ steps.codesign.outputs.signed-dmg-path }}
          EXPECTED_DMG_SHA256: ${{ steps.verified_harness.outputs.dmg_sha256 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NAME="Buzz_${VERSION}_aarch64-signed.dmg"
          cp "$SIGNED_DMG" "$RUNNER_TEMP/$NAME"
          test "$(shasum -a 256 "$RUNNER_TEMP/$NAME" | awk '{print $1}')" = \
            "$EXPECTED_DMG_SHA256"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-macos-canary-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Measure release Cargo cache inputs
        if: always()
        run: du -sh ~/.cargo/registry ~/.cargo/git target desktop/src-tauri/target 2>/dev/null || true

      # Only this trusted, main-bound canary writes the cache. Excluding bundle
      # output prevents installers or signed artifacts from entering it.
      - name: Save exact release Cargo cache
        if: steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Save pnpm store cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
