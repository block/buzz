name: Desktop release cache tag-scope proof

# Run this workflow from a harmless cache-proof-* tag created on trusted main.
# It restores only and fails unless that tag can see the exact cache produced
# by the default-branch signed canary. It never builds, packages, or saves.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: Prove macOS arm64 cache visibility
    if: github.repository == 'block/buzz'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Require cache proof tag
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != refs/tags/cache-proof-* ]]; then
            echo "::error::Run this workflow from a cache-proof-* tag; got $SOURCE_REF"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Patch proof version and dependency graph
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "0.0.0-cache-proof"
          cd src-tauri && cargo update --workspace

      - name: Compute exact release cache key
        id: rust_cache_key
        run: |
          KEY=$(scripts/desktop-release-cache-key.py \
            --platform "$RUNNER_OS" \
            --target aarch64-apple-darwin \
            --features mesh-llm \
            --native-inputs macos-15-deployment-10.15-metal)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Release cache key: $KEY"

      - name: Restore default-branch release Cargo cache from tag
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Require exact cache hit
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.rust_cache.outputs.cache-primary-key }}
          EXPECTED_KEY: ${{ steps.rust_cache_key.outputs.key }}
        run: |
          if [[ "$CACHE_HIT" != "true" || "$CACHE_KEY" != "$EXPECTED_KEY" ]]; then
            echo "::error::Tag could not restore exact default-branch cache (hit=$CACHE_HIT, restored=$CACHE_KEY, expected=$EXPECTED_KEY)"
            exit 1
          fi
          du -sh ~/.cargo/registry ~/.cargo/git target desktop/src-tauri/target 2>/dev/null || true
