name: Nix

on:
  push:
    branches: [main, release]
    paths:
      - ".github/workflows/nix.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "desktop/**"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "package.json"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - ".github/workflows/nix.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "desktop/**"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "package.json"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check Nix formatting
        run: nix fmt -- --check flake.nix nix/buzz.nix nix/versions.nix nix/modules/buzz-relay.nix

      - name: Evaluate all supported systems
        run: nix flake show --all-systems

      - name: Build relay and NixOS module check
        run: nix flake check --print-build-logs

      - name: Build desktop and sidecars
        run: nix build --print-build-logs .#buzz-desktop .#buzz-sidecars
