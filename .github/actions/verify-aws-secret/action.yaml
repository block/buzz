name: Verify AWS Secret
description: >
  Read a JSON secret from AWS Secrets Manager, mask every value in the logs,
  and fail if any required key is missing or empty. Values are never exported;
  the cluster reads the secret itself (ExternalSecret in meq-eks-workloads).

inputs:
  aws-access-key-id:
    required: true
    description: AWS access key with secretsmanager:GetSecretValue on the secret.
  aws-secret-access-key:
    required: true
    description: AWS secret access key.
  aws-region:
    required: false
    default: us-east-1
    description: AWS region for Secrets Manager.
  secret-id:
    required: true
    description: Secrets Manager secret ID, for example dev/buzz/secrets.
  required-keys:
    required: true
    description: Space-separated keys that must exist in the SecretString JSON.

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      env:
        SECRET_ID: ${{ inputs.secret-id }}
        REQUIRED_KEYS: ${{ inputs.required-keys }}
      run: |
        set -euo pipefail
        SECRET=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)
        while IFS= read -r value; do
          [ -n "$value" ] && echo "::add-mask::$value"
        done < <(jq -r 'to_entries[] | .value | tostring' <<<"$SECRET")

        missing=0
        for key in $REQUIRED_KEYS; do
          if [ -z "$(jq -r --arg k "$key" '.[$k] // empty' <<<"$SECRET")" ]; then
            echo "::error::$SECRET_ID is missing key $key"
            missing=1
          fi
        done
        exit $missing
