include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    # riverpod_lint 3.1 uses custom_lint, which still requires legacy plugins.
    analysis_options_deprecated_plugins: ignore
    invalid_use_of_visible_for_overriding_member: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
