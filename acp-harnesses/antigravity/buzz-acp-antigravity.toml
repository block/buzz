# Antigravity ACP Harness — buzz-acp configuration
# Place in: acp-harnesses/antigravity/buzz-acp-antigravity.toml

[agent]
kind = "custom"
command = ["python3", "/opt/buzz/acp-harnesses/antigravity/buzz_acp_antigravity.py"]

[agent.env]
# Gemini API key — required. Get yours at https://aistudio.google.com/apikey
GEMINI_API_KEY = "${GEMINI_API_KEY}"
# Optional: override the default model (gemini-2.0-flash)
# GEMINI_MODEL = "gemini-2.5-pro"

[relay]
url = "${BUZZ_RELAY_URL}"
private_key = "${BUZZ_PRIVATE_KEY}"

[pool]
# Number of concurrent Antigravity sessions (one per active channel)
size = 2
timeout_secs = 120
