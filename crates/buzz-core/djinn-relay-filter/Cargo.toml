[package]
name = "djinn-relay-filter"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = ["baseline"]

[dependencies]
djinn = { path = "../../../../rust-djinn/rust-djinn" }
buzz-core = { path = ".." }
nostr = "=0.44.7"
uuid = "1"
chrono = "0.4"
serde_json = "1"
relay-filter-baseline = { path = "baseline" }

[package.metadata.charon]
preset = "aeneas"

[package.metadata.djinn]
spec = ["src/input.rs", "src/spec.rs"]
namespace = "RelayFilter"
bench = "bench::workload"
