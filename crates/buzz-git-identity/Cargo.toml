[package]
name = "buzz-git-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic agent git identity: author/email/signing GIT_CONFIG_* construction shared by the harness and dev-mcp"

[lib]
name = "buzz_git_identity"
path = "src/lib.rs"

[dependencies]
nostr = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
