[package]
name = "buzz-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Postgres event store and data access layer for Buzz"

[dependencies]
buzz-auth = { workspace = true }
buzz-core = { workspace = true }
buzz-datastore-tracing = { workspace = true }
async-trait = "0.1"
http        = { workspace = true }
buzz-media = { workspace = true }
dashmap     = { workspace = true }
sqlx        = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
hex         = { workspace = true }
sha2        = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
nostr       = { workspace = true }
rand        = { workspace = true }
metrics     = { workspace = true }
s3 = { version = "0.37", package = "rust-s3", default-features = false, features = ["tokio-rustls-tls", "fail-on-err", "tags"] }

[features]
test-utils = []

[dev-dependencies]
tokio = { workspace = true }
metrics-util = { workspace = true }
