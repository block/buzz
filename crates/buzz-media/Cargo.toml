[package]
name = "buzz-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Media storage, validation, and thumbnail generation for Buzz"

[dependencies]
buzz-core = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
ulid = "1"
uuid = { workspace = true }
axum = { workspace = true }
s3 = { version = "0.37", package = "rust-s3", default-features = false, features = ["tokio-rustls-tls", "fail-on-err", "tags"] }
infer = "0.19"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
blurhash = "0.2"
imagesize = "0.14"
bytes = "1"
mp4 = "0.14"
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
futures-core = "0.3"
quick-xml = { version = "0.38", features = ["serialize"] }
# `timeout` only: names `tower_http::timeout::TimeoutError` so the upload
# stream can classify an idle-timeout body error by *type* (not by Display
# string) and map it to `MediaError::RequestBodyTimeout` / 408.
tower-http = { version = "0.6", default-features = false, features = ["timeout"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# BodyExt::frame — drives a real TimeoutBody in classify_body_error tests so
# the typed-detection test exercises a genuine tower-http TimeoutError chain.
http-body-util = "0.1"
# http_body::Body impl for the never-yielding test body driving TimeoutBody.
http-body = "1"
