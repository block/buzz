[package]
name = "buzz-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authentication and authorization for Buzz"

[features]
test-utils = []
dev = []

[dev-dependencies]
# `use_pem` enables EncodingKey::from_ec_pem for minting ES256 test assertions.
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
tokio        = { workspace = true, features = ["test-util"] }

[dependencies]
buzz-core = { workspace = true }
base64       = { workspace = true }
chrono       = { workspace = true }
jsonwebtoken = { workspace = true }
nostr        = { workspace = true }
futures-util = { workspace = true }
reqwest      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
rand         = { workspace = true }
uuid         = { workspace = true }
url          = { workspace = true }
