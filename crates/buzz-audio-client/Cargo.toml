[package]
name = "buzz-audio-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Huddle audio transport and codecs without a desktop application"

[features]
default = ["native-roots"]
native-roots = ["tokio-tungstenite/rustls-tls-native-roots"]
webpki-roots = ["tokio-tungstenite/rustls-tls-webpki-roots"]

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
# Keep the audited unused ringbuf dependency pinned until NetEQ removes it.
neteq = { version = "=0.8.3", default-features = false }
opus = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util"] }
