# Solo gpt-5.6-sol on the OpenAI-direct route at `thinking_effort: high` -- the
# matched control for tb-gt-sol-2terra-high.
#
# WHY THIS EXISTS. tb-gt-sol-2terra-high pins high effort on all three of its
# seats. The study already has a solo sol cell on this route
# (tb-solo-sol-openai) but it leaves effort unpinned, so scoring the team
# against it would move effort and headcount together -- the joint-delta mistake
# tb-solo-luna-openai had to be built to undo. This cell is the same solo agent
# with the same one thing changed that the team cell changed.
#
# What is held against tb-gt-sol-2terra-high: route, lead model, thinking
# effort, price sheet, trial budget, container CPU/memory, clock multiplier,
# dataset and concurrency. What moves: the two terra seats and the goosetown
# personas that coordinate them. That is the whole comparison -- at the top of
# the effort ramp, does wrapping a sol lead in two capable subordinates beat sol
# working alone?
#
# BUILT FOR LHTB, not Terminal-Bench. It runs fine on either -- nothing in the
# manifest names a dataset -- but see docs/09-lhtb-benchmark.md: run it with the
# patched `continue_until_timeout` and `--timeout-multiplier 3.0`, or the 24
# long-horizon tasks execute single-shot and the number is not comparable to
# anything.
#
# One statistical note that does not apply to the Terminal-Bench cells: LHTB
# verifiers emit PARTIAL credit (they call `_partial_reward(details)` against a
# per-gate dict), so rewards are graded, not binary. The paired exact McNemar
# test the TB analysis rests on is the wrong tool here -- use means with a
# paired Wilcoxon signed-rank over the shared task set (`paired_w.py`).
#
# Endpoint names resolve via testbed/endpoints/openai-live.json.
schema_version: "1"
condition: tb-solo-sol-high
roster:
  - id: solo
    kind: orchestrator
    role: solo
    count: 1
    endpoint: gpt-5.6-sol
    model_revision: gpt-5.6-sol
    prompt:
      # Byte-identical to every other solo cell in the study.
      path: personas/bench/solo.md
      sha256: 61c9ac9dc47cbd3c987a7ee6ceb7397496834df8d3fc284c8fe6980e1d5b4ebe
    generation:
      # Must match every seat in tb-gt-sol-2terra-high; that pairing is the only
      # reason this cell exists. `gpt-5.6-sol` matches the `gpt-5.6` family
      # token in config.rs, whose supported set includes high, and A2x already
      # ran this endpoint one notch further at `xhigh` -- the value is neither
      # rejected nor silently clamped here.
      thinking_effort: high
prices:
  # The same sol row tb-gt-sol-2terra-high carries, so the cost column measures
  # token volume rather than a pricing edit. No terra row: there are no terra
  # seats, and an unused price row is a claim the cell cannot support.
  gpt-5.6-sol:
    input_per_million_usd: 5.0
    cached_input_per_million_usd: 0.5
    output_per_million_usd: 30.0
    # Fallback only. On the direct OpenAI Responses route the provider reports
    # the split at usage.prompt_tokens_details.cached_tokens and the harness
    # stamps accounting_cache_read_tokens_are_measured: true; 0.0 keeps an
    # unmeasured run conservative rather than optimistic.
    cache_read_rate: 0.0
trial_budget:
  # Identical to tb-gt-sol-2terra-high. Does not bind on LHTB anyway -- Harbor
  # enforces each task's own `[agent] timeout_sec` scaled by the run's
  # --timeout-multiplier.
  timeout_seconds: 36000

environment:
  # Identical in every condition -- see tb-solo-luna.yaml for the full reasoning.
  override_cpus: 4
  override_memory_mb: 8192
