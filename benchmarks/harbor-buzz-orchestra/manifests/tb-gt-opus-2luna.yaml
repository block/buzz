# G1 -- goosetown personas with a claude-opus-5 lead over one read-only luna
# scout and one luna worker, through the Databricks AI Gateway.
#
# THIS IS THE CLEAN PERSONA A/B, and it is the only cell in the wave that is
# one. Against tb-team-opus-luna (C3, condition tb-team-opus-2luna) it holds
# constant every single thing the study can hold:
#
#   same lead model      databricks-claude-opus-5
#   same delegate model  databricks-gpt-5-6-luna, 2 seats
#   same headcount       3 agents in one container
#   same route           opus -> anthropic-messages, luna -> /responses
#   same price sheet, same clock, same container, same effort (medium, unpinned)
#
# The only difference is the persona bytes. So the G1-vs-C3 delta is
# attributable to the prompt scheme and to nothing else -- which is what makes
# this cell worth running on the two-route gateway rather than moving it to the
# clean OpenAI path like G1s. Moving it would have bought route cleanliness and
# lost the controlled comparison, and G1s already provides the clean route.
#
# What C3 measured, and what this is trying to fix:
#
#   C3  score 0.831   cost $68.00   input 51.6M   $/solved 0.92
#   A3  score 0.795   cost $48.17   input 28.5M   $/solved 0.69   (solo opus)
#   A2  score 0.843   cost $41.52   input 25.5M   $/solved 0.55   (solo sol)
#
# C3 bought +0.036 over solo opus for 1.81x its input tokens, and still lost to
# solo sol on both axes. The diagnosis is in the old persona's own words:
# personas/bench/lead-delegate.md:40 told the lead "do the work directly when
# that is the shorter path" and framed delegation as something that has to earn
# its round trip. That describes a solo agent with an expensive habit, and C3's
# numbers are what that produces -- score at solo-opus level, tokens at team
# level.
#
# personas/bench/gt/gt-lead.md replaces the trade-off with a boundary: reads are
# the lead's, every byte written is a teammate's, and there is deliberately no
# trivial-write exception, because the exception is the loophole the old persona
# fell through. Whether a lead that cannot type is better or worse than one that
# can is the question; a null here with C3's cost profile intact would be a
# genuine finding about hierarchy, not a failed rewrite.
#
# Endpoint names are exact Databricks serving-endpoint names and resolve via
# testbed/endpoints/databricks-example.json. buzz-agent's `databricks_v2` provider
# picks the route per model from the endpoint name; see tb-solo-opus.yaml for the
# detail.
schema_version: "1"
condition: tb-gt-opus-2luna
roster:
  - id: lead
    kind: orchestrator
    role: lead
    count: 1
    endpoint: databricks-claude-opus-5
    model_revision: claude-opus-5
    prompt:
      path: personas/bench/gt/gt-lead.md
      sha256: 8a27e833dec0a6d1700c5ea3100f8a81c09e5090ef0a589b9583fac40b24c05c

  - id: scout
    kind: worker
    role: scout
    count: 1
    endpoint: databricks-gpt-5-6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/gt/gt-scout.md
      sha256: 0359a957428dd09e56e57a7fd3fe455d860264d910705f0e4992337dde25e5a5

  - id: worker
    kind: worker
    role: worker
    count: 1
    endpoint: databricks-gpt-5-6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/gt/gt-worker.md
      sha256: 7a529ae58f2a2ec635fdf65fb43284b30c09d2c9dbf31e70951fe021c3b2b766

prices:
  # Repriced 2026-07-30: luna 1.0/0.1/6.0 -> 0.20/0.02/1.20 (-80%).
  # Sol, Opus 5, Sonnet and Haiku did not move. This changes the
  # condition hash, so a cell that ran before this date carries the old
  # hash and the old rates in its receipts -- that mismatch is expected,
  # not corruption. Restate a completed cell's cost with
  # benchmark-runs/tools/reprice.py, which re-prices the measured tokens
  # at a new sheet. Never edit a receipt: the tokens are the
  # measurement, the price sheet is only an overlay on them.
  # Byte-identical to tb-team-opus-luna.yaml. The G1-vs-C3 comparison is a cost
  # comparison as much as a score one, so the rate sheet has to be the same
  # sheet or the delta is partly a pricing edit.
  #
  # Opus is 5x luna on input and cache-read but ~4.17x on output; see
  # tb-solo-opus.yaml for the cache-write (cache_creation) surcharge caveat,
  # which lands hardest on the lead's high-context seat. See tb-solo-luna.yaml
  # for why cache_read_rate is 0.0 (DB10).
  databricks-claude-opus-5:
    input_per_million_usd: 5.0
    cached_input_per_million_usd: 0.5
    output_per_million_usd: 25.0
    cache_read_rate: 0.0
  databricks-gpt-5-6-luna:
    input_per_million_usd: 0.2
    cached_input_per_million_usd: 0.02
    output_per_million_usd: 1.2
    cache_read_rate: 0.0
trial_budget:
  timeout_seconds: 36000

environment:
  # Identical in every condition -- see tb-solo-luna.yaml for the full reasoning.
  override_cpus: 4
  override_memory_mb: 8192
