# Terminal-Bench trial: 1 Sonnet 4.6 orchestrator + 2 Haiku 4.5 workers over
# one Buzz channel. Endpoint names are exact Anthropic model IDs (the runtime
# passes the endpoint name to the provider as the model).
# Prices: Anthropic list $/Mtok as of 2026-07 (Sonnet 3/15, Haiku 1/5).
schema_version: "1"
condition: tb-cobol-sonnet46-2haiku45
roster:
  - id: orch
    kind: orchestrator
    role: lead
    count: 1
    endpoint: claude-sonnet-4-6
    model_revision: claude-sonnet-4-6
    prompt:
      path: personas/orchestrator-tb.md
      sha256: 206829331cdd85fb277266901b9489e190ba23097600a8bb69142d044b9a42e6

  - id: worker
    kind: worker
    role: implementer
    count: 2
    endpoint: claude-haiku-4-5
    model_revision: claude-haiku-4-5
    prompt:
      path: personas/worker-tb.md
      sha256: 664a994ae3ba93f02ebbb8f61f781f6a59ea3327b21e26e7ffc2d06827ed3e45

# Cache-read rates are 0.0 on every Anthropic-route endpoint on purpose:
# buzz-agent never sends `cache_control`, and Anthropic prompt caching is
# opt-in, so no cache reads occur and no discount should be modelled. Revisit
# this the moment buzz-agent starts requesting caching, and set a measured rate
# for OpenAI-route endpoints (which cache automatically) rather than a guess.
prices:
  claude-sonnet-4-6:
    input_per_million_usd: 3
    cached_input_per_million_usd: 0.3
    output_per_million_usd: 15
    cache_read_rate: 0.0
  claude-haiku-4-5:
    input_per_million_usd: 1
    cached_input_per_million_usd: 0.1
    output_per_million_usd: 5
    cache_read_rate: 0.0
trial_budget:
  # 36000 = the dataset's longest task (12000s) at the 3x timeout multiplier the
  # study runs with (DEFAULT_TIMEOUT_MULTIPLIER in scripts/benchmark.py). The two
  # are one setting in two files: benchmark.py refuses to start if this is the
  # smaller of the pair, because the harness would then cut a task short of the
  # deadline Harbor granted it and record a timeout the agent never hit. A flat
  # 900s did exactly that before the multiplier existed — 39 of the 89 tasks
  # allow more than 900s, and one live trial died at 905s against a task budget
  # of 1800s.
  timeout_seconds: 36000
