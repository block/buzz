# B1h -- two gpt-5.6-luna peers at reasoning effort `high`, direct from OpenAI.
#
# The pairing question asked again with the effort dial turned up. It exists
# because the two dials could interact, and the study has no way to see that
# from the solo cells alone:
#
#   B1 (medium) scored 0.536 against A1's 0.545 -- pairing bought nothing at
#   the cheap floor. One reading is that two luna agents simply cannot solve
#   what one luna agent cannot. Another is that the pair spends its advantage
#   on coordination it is not thinking hard enough to use well. Those predict
#   different things at `high`: the first says B1h tracks A1h exactly, the
#   second says the gap closes or inverts.
#
# Against tb-solo-luna-high it holds model, route, price sheet, persona bytes,
# effort, clock and container fixed and varies only headcount -- so the A1h/B1h
# delta is attributable to the pairing itself. Against tb-peer-2luna it varies
# effort *and* route together; see tb-solo-luna-high.yaml for why the route
# moved and why that comparison must be reported as a joint one.
#
# Expect this to be the most expensive cell of the four. Two agents at high
# effort, and every handoff re-sends context -- doc 02 §2's point that re-sent
# context is the entire bill applies with extra force when each of those tokens
# was more expensive to produce. That is the measurement, not a defect.
schema_version: "1"
condition: tb-peer-2luna-high
roster:
  - id: driver
    kind: orchestrator
    role: driver
    count: 1
    endpoint: gpt-5.6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/peer-driver.md
      sha256: 1cf4d1cbf4093dd0d9b1a6a7ccd9a875c39621d0bab3ddec7e0bb23177761149
    generation:
      # Both roster entries pin the same level. Raising effort for only one seat
      # would be a different and more confusing experiment -- an asymmetric pair
      # -- and it is not the one that was asked for.
      thinking_effort: high

  - id: navigator
    kind: worker
    # Read verbatim by both personas out of the "Your team" table -- peer-driver
    # addresses `navigator` and peer-navigator addresses `driver`. Renaming
    # either role here silently breaks the pairing: the @mention resolves to
    # nobody, the send still reports success, and the trial stalls to timeout.
    role: navigator
    count: 1
    endpoint: gpt-5.6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/peer-navigator.md
      sha256: dcf2ae226b5967067687060871438397125e54b8c412f69076eb2a8edd56d2c5
    generation:
      thinking_effort: high

prices:
  # Repriced 2026-07-30: luna 1.0/0.1/6.0 -> 0.20/0.02/1.20 (-80%).
  # Sol, Opus 5, Sonnet and Haiku did not move. This changes the
  # condition hash, so a cell that ran before this date carries the old
  # hash and the old rates in its receipts -- that mismatch is expected,
  # not corruption. Restate a completed cell's cost with
  # benchmark-runs/tools/reprice.py, which re-prices the measured tokens
  # at a new sheet. Never edit a receipt: the tokens are the
  # measurement, the price sheet is only an overlay on them.
  # Identical to tb-solo-luna-high, deliberately -- holding the rates equal is
  # what makes the solo-versus-pair cost *ratio* sound.
  gpt-5.6-luna:
    input_per_million_usd: 0.2
    cached_input_per_million_usd: 0.02
    output_per_million_usd: 1.2
    # Fallback only; superseded by the provider's measured split. Caching is
    # load-bearing for this condition in a way it is not for a solo one: the
    # pair's cost is driven by re-sent context, which is exactly what a prefix
    # cache serves.
    cache_read_rate: 0.0
trial_budget:
  # Matches the solo cells exactly. A pair genuinely needs longer than a solo
  # agent -- every handoff is a round trip -- but giving it a larger budget
  # would confound the comparison, and it does not bind anyway: Harbor enforces
  # each task's own `[agent] timeout_sec` scaled by the study's 3x multiplier.
  timeout_seconds: 36000

environment:
  # Identical in every condition -- see tb-solo-luna.yaml for the full reasoning.
  override_cpus: 4
  override_memory_mb: 8192
