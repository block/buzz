# A5m -- solo gpt-5.6-terra at reasoning effort `medium`, served direct from OpenAI.
#
# WHAT THIS ISOLATES. Byte-identical to tb-solo-terra-high in every field except
# `thinking_effort` -- same roster, same persona bytes, same endpoint, same
# revision, same prices, same budget, same container. So A5m -> A5h is a clean
# one-variable read on effort, for terra, and it is the piece
# tb-solo-terra-high's own header said was missing:
#
#   "There is no terra-at-medium cell, so this manifest measures a *tier*, not
#    an effort delta."
#
# Now there is. Read the pair as the effort axis; read either against A1/A2 as
# the tier axis.
#
# WHY IT MATTERS THAT THIS IS THE CHEAP END. The two effort pairs already
# measured both start from a strong model: A2 -> A2x (sol, medium -> xhigh)
# *lost* 0.006 while costing 2.6x, and A1h showed luna gaining 0.205 for 3.1x.
# So effort paid enormously at the bottom of the tier ladder and not at all at
# the top. Terra sits between them, which makes A5m -> A5h the datapoint that
# says whether that is a smooth curve or a cliff, and where the cliff is. A5h
# already scores 0.807 -- within noise of solo sol's 0.843 at a fraction of the
# price -- so if A5m lands close to A5h, the study's cheapest good answer gets
# cheaper still.
#
# EFFORT IS PINNED, NOT LEFT DEFAULT. `medium` may well be what the provider
# would pick anyway, but an unpinned cell records no effort at all in its
# manifest, so a later provider-side default change would silently redefine the
# condition and the hash would not move. Pinning costs nothing and makes the
# comparison legible from the manifest alone.
#
# The level reaches the provider rather than being clamped: `gpt-5.6-terra`
# matches the `gpt-5.6` family token in config.rs, and the live probe that
# qualified A5h moved reasoning_tokens 73 -> 81 between medium and high -- i.e.
# medium was the measured baseline of that probe, so it is known-good by
# construction.
#
# PRICES. The 2026-07-30 sheet, same as every other terra cell:
#
#            input   cached   output
#   luna      0.20     0.02     1.20     (1x)
#   terra     2.00     0.20    12.00     (10x luna, 0.4x sol)
#   sol       5.00     0.50    30.00     (25x luna)
#
# Note terra is no longer the tidy midpoint tb-solo-terra-high's header
# describes -- that text predates the drop, which cut luna 80% and terra 20%.
# The three tiers are still ordered the same way, but the gaps are now very
# uneven, so any "price/performance curve" reading has to use these numbers
# rather than the old ones.
#
# Endpoint names resolve via testbed/endpoints/openai-live.json.
schema_version: "1"
condition: tb-solo-terra-medium
roster:
  - id: solo
    kind: orchestrator
    role: solo
    count: 1
    endpoint: gpt-5.6-terra
    model_revision: gpt-5.6-terra
    prompt:
      # Byte-identical to every other solo cell in the study.
      path: personas/bench/solo.md
      sha256: 61c9ac9dc47cbd3c987a7ee6ceb7397496834df8d3fc284c8fe6980e1d5b4ebe
    generation:
      thinking_effort: medium
prices:
  # Identical to tb-solo-terra-high. Effort moves token volume, not the rate
  # card. The published $2.50/Mtok cache-WRITE rate still has no home in this
  # schema, so this cell is understated by the same bounded amount as A5h --
  # equally, so the effort comparison is unaffected.
  gpt-5.6-terra:
    input_per_million_usd: 2.0
    cached_input_per_million_usd: 0.2
    output_per_million_usd: 12.0
    # Fallback only; the direct OpenAI Responses route reports the real split
    # and the harness prefers it. See tb-solo-luna-high.yaml.
    cache_read_rate: 0.0
trial_budget:
  # Identical to A5h. A lower-effort cell needs less clock, not more, so this
  # cannot bind here in any way it did not already bind there.
  timeout_seconds: 36000

environment:
  # Identical in every condition -- see tb-solo-luna.yaml for the full reasoning.
  override_cpus: 4
  override_memory_mb: 8192
