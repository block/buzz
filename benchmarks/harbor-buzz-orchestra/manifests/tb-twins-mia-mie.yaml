# Twin team: Mia (conn) + Mie — hello-world smoke of the twin prompt pair
# (Tyler, buzz-benchmarking thread 397a992d, 2026-08-08). Both personas are
# the Meli personal prompt (meli-solo.md de633019 minus its final
# unattended-solo line) plus twin team sections; byte-identical to each
# other except the identity line and the conn/worker paragraph. Contract:
# thread-of-record comms (--reply-to the task post), both keep the todo
# tool loaded, Mia never ends her turn while the task is incomplete
# (sleep-30 poll loop — requires unbounded rounds, i.e. #5145 head
# d2dccf7a+), Mie ends every turn with a report @mentioning Mia, only Mia
# sends DONE:. Mia is the orchestrator seat because _wait_for_done watches
# the orchestrator pubkey for DONE:.
# Model/provider: deepseek-v4-flash via OpenRouter pinned cloudflare/fp8 —
# the validated zero-429 path (tb21-solo-3) and the Meli prompt's home
# model, so the twins' plumbing is the only new variable.
schema_version: "1"
condition: tb-twins-mia-mie
roster:
  - id: mia
    kind: orchestrator
    role: conn
    count: 1
    endpoint: deepseek/deepseek-v4-flash-0731
    model_revision: deepseek/deepseek-v4-flash-20260731
    prompt:
      path: personas/bench/mia.md
      sha256: bdda429b6248305ac43c44a5f585ee7b03bcd97bb1bc3b8be2ba6933787fa12f
    generation:
      thinking_effort: high
  - id: mie
    kind: worker
    role: twin
    count: 1
    endpoint: deepseek/deepseek-v4-flash-0731
    model_revision: deepseek/deepseek-v4-flash-20260731
    prompt:
      path: personas/bench/mie.md
      sha256: a4924e4c4507ac466a7500bb34a04a782618df41dba850b6f0f729787c48439b
    generation:
      thinking_effort: high
prices:
  deepseek/deepseek-v4-flash-0731:
    # cloudflare/fp8 listed rates (OpenRouter endpoints API, 2026-08-07):
    # prompt $0.14/M, completion $0.28/M.
    input_per_million_usd: 0.14
    cached_input_per_million_usd: 0.14
    output_per_million_usd: 0.28
    cache_read_rate: 0.0
trial_budget:
  timeout_seconds: 36000

environment:
  # Identical in every condition -- see tb-solo-luna.yaml for the reasoning.
  override_cpus: 4
  override_memory_mb: 8192
