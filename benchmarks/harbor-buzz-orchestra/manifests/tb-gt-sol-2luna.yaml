# G1s -- goosetown personas with a gpt-5.6-sol lead over one read-only luna
# scout and one luna worker. Single provider, single route, direct from OpenAI.
#
# This is the strongest version of the hybrid the study argues against, and it
# is a cleaner cell than the opus-led G1 for three separate reasons:
#
#   * ONE ROUTE. sol and luna are both gpt-5.6 family and both take the OpenAI
#     `/responses` path. Every opus-led cell in this study (C3, G1, G2) is
#     inherently two-route -- opus goes to /ai-gateway/anthropic/v1/messages
#     because it does not speak /responses -- so the lead's model and the lead's
#     serving path move together and cannot be separated. Here they do not move.
#   * IT IS THE BETTER STEELMAN. sol solo scored 0.843 against opus solo's
#     0.795. The expensive model that a hybrid should be built around is the one
#     that wins alone, and on this dataset that is sol.
#   * EXACT ARITHMETIC. sol is 5.00/0.50/30.00 against luna's 1.00/0.10/6.00 --
#     exactly 5x on input, cache-read *and* output. Every price ratio this cell
#     reports is a clean 5x with no output-axis fudge, which is doc 02 §2's
#     parity argument stated in its sharpest form.
#
# The comparison set:
#
#   G0  -> G1s   lead model only (luna -> sol); persona bytes, route, headcount,
#                container and clock all held
#   G1s -> G2s   recon width only (1 scout -> 2)
#   G1s vs A2    the whole question: does a well-orchestrated cheap team wrapped
#                around one sol lead beat sol working alone (0.843, $41.52)?
#
# The mechanism under test is cost as much as score. C3 put an expensive lead in
# the most token-heavy seat and spent 51.6M input tokens to solo opus's 28.5M --
# 1.81x -- for +0.036. gt-lead.md is written to attack exactly that: the lead
# reads structured briefs and verdicts instead of raw terminal output, and
# gt-scout.md/gt-worker.md are both told to send the decisive output rather than
# the transcript, because every pasted log line is re-sent on every subsequent
# round. Whether that actually shrinks the expensive seat is the measurement,
# not an assumption -- the lead also reads *more* reports than C3's did, and
# those two effects pull opposite ways.
#
# Endpoint names resolve via testbed/endpoints/openai-live.json.
schema_version: "1"
condition: tb-gt-sol-2luna
roster:
  - id: lead
    kind: orchestrator
    # See tb-gt-3luna.yaml: `lead`, `scout` and `worker` are all read verbatim
    # out of the "Your team" table by the personas. Renaming any of them breaks
    # addressing silently -- the @mention resolves to nobody, the send still
    # reports success, and the trial stalls to its timeout.
    role: lead
    count: 1
    endpoint: gpt-5.6-sol
    model_revision: gpt-5.6-sol
    prompt:
      # Byte-identical to the file G0, G2s, G1 and G2 pin, so the lead's
      # instructions are not a variable anywhere in this wave -- only the lead's
      # model and the number of scouts are.
      path: personas/bench/gt/gt-lead.md
      sha256: 8a27e833dec0a6d1700c5ea3100f8a81c09e5090ef0a589b9583fac40b24c05c

  - id: scout
    kind: worker
    role: scout
    count: 1
    endpoint: gpt-5.6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/gt/gt-scout.md
      sha256: 0359a957428dd09e56e57a7fd3fe455d860264d910705f0e4992337dde25e5a5

  - id: worker
    kind: worker
    role: worker
    count: 1
    endpoint: gpt-5.6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/gt/gt-worker.md
      sha256: 7a529ae58f2a2ec635fdf65fb43284b30c09d2c9dbf31e70951fe021c3b2b766

prices:
  # Repriced 2026-07-30: luna 1.0/0.1/6.0 -> 0.20/0.02/1.20 (-80%).
  # Sol, Opus 5, Sonnet and Haiku did not move. This changes the
  # condition hash, so a cell that ran before this date carries the old
  # hash and the old rates in its receipts -- that mismatch is expected,
  # not corruption. Restate a completed cell's cost with
  # benchmark-runs/tools/reprice.py, which re-prices the measured tokens
  # at a new sheet. Never edit a receipt: the tokens are the
  # measurement, the price sheet is only an overlay on them.
  # Both rows are load-bearing: this is a mixed-model cell, so the headline
  # $/solved-task depends on the split between the seats as well as on the
  # totals. The figures are the same ones every other sol and luna cell carries.
  gpt-5.6-sol:
    input_per_million_usd: 5.0
    cached_input_per_million_usd: 0.5
    output_per_million_usd: 30.0
    cache_read_rate: 0.0
  gpt-5.6-luna:
    input_per_million_usd: 0.2
    cached_input_per_million_usd: 0.02
    output_per_million_usd: 1.2
    cache_read_rate: 0.0
trial_budget:
  # Identical to the solo baselines. A team genuinely needs longer than a solo
  # agent -- every handoff is a round trip -- but giving it a larger budget would
  # confound the comparison it exists to make, and it does not bind anyway:
  # Harbor enforces each task's own `[agent] timeout_sec` scaled by 3x.
  timeout_seconds: 36000

environment:
  # Identical in every condition -- see tb-solo-luna.yaml for the full reasoning.
  override_cpus: 4
  override_memory_mb: 8192
