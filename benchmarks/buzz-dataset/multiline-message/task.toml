schema_version = "1.3"

[task]
name = "buzz-native/multiline-message"
description = "Deliver a multiline Buzz message without flattening or escaping its layout."
authors = [{ name = "Buzz" }]
keywords = ["buzz-native", "messaging", "multiline", "cli"]

[metadata]
evaluation_layer = "regression"
difficulty = "medium"
category = "collaboration"
tags = ["messaging", "multiline", "cli"]

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 30.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 1024
storage_mb = 1024
