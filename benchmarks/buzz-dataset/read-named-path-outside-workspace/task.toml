schema_version = "1.3"

[task]
name = "buzz-native/read-named-path-outside-workspace"
description = "Read an explicitly named file outside the Buzz workspace."
authors = [{ name = "Buzz" }]
keywords = ["buzz-native", "filesystem", "workspace", "named-path"]

[metadata]
evaluation_layer = "regression"
