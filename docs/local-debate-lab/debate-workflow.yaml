name: Дебати v2 — тема в кожному кроці
description: >-
  Четверо агентів, три раунди, строго по одному за раз. Проти v1 змінено три
  речі: тема підставляється в КОЖЕН крок (у v1 її бачив лише перший, решта мала
  шукати її в історії каналу — локальні моделі не знаходили і брали чужу тему з
  попередніх прогонів); паузи зрізані вдвічі за виміряними затримками; фінальний
  підсумок робить Claude, бо репліки Gemma4 стабільно потрапляють у тред і в
  стрічці їх не видно.
  Тригер спрацьовує лише коли повідомлення ПОЧИНАЄТЬСЯ з "ДЕБАТИ СТАРТ" — тому
  кроки можуть цитувати тему всередині тексту, не запускаючи новий прогін.

  Дві межі рушія, які варто знати: одна пауза не може перевищувати 270 секунд
  (приклади "5m" і "1h" у документації цю межу перевищують — block/buzz#3021),
  а поле enabled у YAML не діє взагалі: планувальник читає окрему колонку в базі
  (block/buzz#4639). Вимикати треба через API або SQL, не редагуванням YAML.
trigger:
  on: message_posted
  filter: str_starts_with(trigger_text, "ДЕБАТИ СТАРТ")
steps:
  - id: r1_claude
    name: Раунд 1 — Claude
    action: send_message
    text: >-
      @Claude раунд 1. Обговорюємо рівно це і нічого іншого — {{trigger.text}}
      Усе, що написано в каналі вище, стосується попередніх сесій: ігноруй.
      Дай позицію і головний аргумент — механізм або приклад, без загальних слів.
  - id: w1
    action: delay
    duration: 60s

  - id: r1_codex
    name: Раунд 1 — Codex
    action: send_message
    text: >-
      @Codex раунд 1. Тема — {{trigger.text}}
      Ігноруй усе, що в каналі вище: то попередні сесії.
      Дай свою позицію незалежно від Claude, з механізмом або прикладом.
  - id: w2
    action: delay
    duration: 60s

  - id: r1_qwen
    name: Раунд 1 — Qwen3.5
    action: send_message
    text: >-
      @Qwen3.5 раунд 1. Тема — {{trigger.text}}
      Ігноруй усе, що в каналі вище: то попередні сесії, вони до цієї теми не стосуються.
      Ти скептик: назви ОДНЕ заперечення саме проти цієї тези, два-три речення,
      з механізмом або прикладом. Якщо не маєш заперечення по темі — так і напиши.
  - id: w3
    action: delay
    duration: 110s

  - id: r1_gemma
    name: Раунд 1 — Gemma4
    action: send_message
    text: >-
      @Gemma4 раунд 1 завершено. Тема була — {{trigger.text}}
      Підсумуй ОДНИМ абзацом, у чому саме учасники цього раунду не згодні.
      Бери лише репліки цього раунду; усе, що вище в каналі, до цієї теми не стосується.
  - id: w4
    action: delay
    duration: 150s

  - id: r2_claude
    name: Раунд 2 — Claude
    action: send_message
    text: >-
      @Claude раунд 2. Тема — {{trigger.text}}
      Атакуй оцінки попередників цього раунду: де саме вони помиляються і чому.
      Якщо чиясь репліка не стосується теми — скажи це прямо й не витрачай на неї раунд.
      Якщо в чомусь вони мають рацію — визнай, тоді заперечуй.
  - id: w5
    action: delay
    duration: 60s

  - id: r2_codex
    name: Раунд 2 — Codex
    action: send_message
    text: >-
      @Codex раунд 2. Тема — {{trigger.text}}
      Назви конкретну хибу в оцінках попередників, включно з Claude. Не загальну незгоду.
  - id: w6
    action: delay
    duration: 60s

  - id: r2_qwen
    name: Раунд 2 — Qwen3.5
    action: send_message
    text: >-
      @Qwen3.5 раунд 2. Тема — {{trigger.text}}
      Твоє заперечення витримало чи ні? Якщо його спростували — скажи прямо.
      Якщо твоє заперечення в раунді 1 було не по темі — визнай це одним реченням
      і дай натомість заперечення саме по цій темі.
  - id: w7
    action: delay
    duration: 110s

  - id: r2_gemma
    name: Раунд 2 — Gemma4
    action: send_message
    text: >-
      @Gemma4 раунд 2 завершено. Тема — {{trigger.text}}
      Що змінилося проти раунду 1: чиї позиції зсунулись і які твердження лишились без підстав.
  - id: w8
    action: delay
    duration: 150s

  - id: r3_claude
    name: Раунд 3 — Claude
    action: send_message
    text: >-
      @Claude раунд 3. Тема — {{trigger.text}}
      Сформулюй підсумкову позицію в тому вигляді, в якому вона витримала критику.
      Назви одну умову, за якої ти б її змінив.
  - id: w9
    action: delay
    duration: 60s

  - id: r3_codex
    name: Раунд 3 — Codex
    action: send_message
    text: >-
      @Codex раунд 3. Тема — {{trigger.text}}
      Підсумкова позиція і одна умова, за якої ти б її змінив.
  - id: w10
    action: delay
    duration: 60s

  - id: r3_qwen
    name: Раунд 3 — Qwen3.5
    action: send_message
    text: >-
      @Qwen3.5 раунд 3. Тема — {{trigger.text}}
      Одним реченням: що з тези опонентів ти визнаєш, а що ні.
  - id: w11
    action: delay
    duration: 110s

  - id: r3_final
    name: Фінальний підсумок — Claude
    action: send_message
    text: >-
      @Claude фінальний підсумок сесії. Тема була — {{trigger.text}}
      Три пункти: до чого дійшли, у чому лишились незгодні, які твердження
      прозвучали без підстав і від кого. Наприкінці напиши ДЕБАТИ ЗАВЕРШЕНО.
