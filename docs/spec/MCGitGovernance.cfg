\* The base configuration.  docs/spec/check.sh derives every check from this
\* file by substitution (the scenario, the seeded error, the property); run
\* that script rather than this file alone.
SPECIFICATION Spec
CONSTANTS
    a = a  b = b  c = c  d = d  m = m  g = g  ci = ci  t2 = t2
    ch1 = ch1  ch2 = ch2  r1 = r1  r2 = r2
    main = main  feat = feat  v1 = v1
    c0 = c0  c1 = c1  c2 = c2  x1 = x1  s1 = s1  s2 = s2
    NoCommit = NoCommit
    None = None
    People = {a, b, c, d, m, ci, t2}
    Agents = {g}
    Channels = {ch1, ch2}
    Repos = {r1, r2}
    Branches = {main, feat}
    Tags = {v1}
    Commits = {c0, c1, c2, x1, s1, s2}
    Secret = {s1}
    CheckNames = {"ci", "lint"}
    Labels = {"pay"}
    Parent <- MCParent
    CodeOwners <- MCCodeOwners
    Content <- MCContent
    RepoKey <- MCRepoKey
    Init_ <- MCInit
    GovChoices <- MCGovChoices
    RoleChanges <- MCRoleChanges
    Bans <- MCBans
    Registrations <- MCRegistrations
    GrantChoices <- MCGrantChoices
    Proposals <- MCProposals
    Reviews <- MCReviews
    Posts <- MCPosts
    ReadChoices <- MCReadChoices
    TagChoices <- MCTagChoices
    Archives <- MCArchives
    MaxVersion = 2
    MaxDecisions = 2
    Scenario = "authority"
    Faults = {}
CONSTRAINT Bounded
INVARIANT TypeOK
INVARIANT QuarantineHolds
INVARIANT SecretsNeverShown
INVARIANT RefsNameShownCommits
PROPERTY LandsUnderCurrentAuthority
PROPERTY RefsMoveOnlyByLanding
PROPERTY GuardedHistoryKept
PROPERTY ReadsAreGovernedAndRecorded
PROPERTY CommandsApplyOnceWhereMeant
PROPERTY GovernanceByCurrentAuthority
PROPERTY GovernedDocsOnlyByCommand
PROPERTY OwnerPinned
PROPERTY ReceiptsMatchDecisions
PROPERTY ReservationsFenced
PROPERTY EveryGovernanceChangeRecorded
PROPERTY RecordOnlyGrows
PROPERTY RoleChangesByCurrentAuthority
