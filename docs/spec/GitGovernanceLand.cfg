\* The base configuration: protocol "row", two processes that may die, and
\* a grant that lapses.  docs/spec/check.sh derives every other configuration
\* from this file by substitution; run that script rather than this file.
SPECIFICATION Spec
CONSTANTS
    Procs = {1, 2}
    Protocol = "row"
    MayCrash = TRUE
    Expiry = 1
    MaxClock = 2
    Faults = {}
INVARIANT EveryLandRecorded
PROPERTY LandsUnderCurrentAuthority NoLostUpdate
