\* The row protocol, checked against GitGovernance and GitRefDB.
\* docs/spec/check.sh derives the seeded checks from this file.
SPECIFICATION MCSpec
CONSTANTS
    a = a  b = b  g1 = g1  g2 = g2  ch = ch  r = r  main = main  k1 = k1  k2 = k2
    NoCommit = NoCommit  None = None  Absent = Absent  NoCall = NoCall
    NoOut = NoOut  NoCmd = NoCmd  NoResp = NoResp  Error = Error
    NoEntry = NoEntry  Manager = Manager
    Procs = {1, 2}
    Protocol = "row"
    MayCrash = TRUE
    Expiry = 1
    MaxClock = 2
    Faults = {}
INVARIANT EveryLandRecorded
PROPERTY GovRefined RefDBRefined GovLands GovRefsMove GovReceipts GovFenced
PROPERTY LandsUnderCurrentAuthority NoLostUpdate
