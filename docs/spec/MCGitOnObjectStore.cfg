\* The main configuration: two concurrent pushers and the default-branch
\* setter over two refs.  docs/spec/check.sh derives every other
\* configuration from this file by substitution; run that script rather than
\* this file alone.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Refs = {main, dev}
    DefaultHead = main
    o1 = o1
    o2 = o2
    Oids = {o1}
    NoOid = NoOid
    Absent = Absent
    NoCall = NoCall
    NoOut = NoOut
    NoCmd = NoCmd
    NoResp = NoResp
    Error = Error
    NoEntry = NoEntry
    Owner = Owner
    Manager = Manager
    NoManifest = NoManifest
    NoRead = NoRead
    ObjParents <- MCObjParents
    CompactAt = 2
    MaxWrites = 3
    HasSetter = TRUE
    HasReader = FALSE
    StaleClients = FALSE
    GitMayCrash = TRUE
    ParentLinks = FALSE
    Decision = "ground-truth"
    EtagMode = "content"
    Faults = {}
SYMMETRY ClientSymmetry
VIEW LiveView
CONSTRAINT Bounded
INVARIANT StoreInvariants
INVARIANT NoSilentDrop
INVARIANT PublishIsAuthorizedChange
PROPERTY Refines
PROPERTY ParentIsPredecessor
