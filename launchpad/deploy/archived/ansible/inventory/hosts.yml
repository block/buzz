---
# Dev VM only. The cohort VPS is a private hostname and must not be committed
# (AGENTS.md rule 2) — put it in hosts.local.yml, which is gitignored.
all:
  children:
    buzz_relay:
      children:
        dev:
          hosts:
            dev-vm:
              ansible_host: 127.0.0.1
              ansible_port: 2222
      vars:
        # The noble cloud image ships python3; do not let Ansible discover 2.x.
        ansible_python_interpreter: /usr/bin/python3

        # Connect as the unprivileged fallback account and escalate, NEVER as
        # root — even though root login works on a freshly built VM.
        #
        # Chunk 10 (SOP Step 13.3) sets `PermitRootLogin no`. An inventory that
        # connects as root would sever Ansible's own access partway through that
        # play, and every subsequent chunk would fail with a permission error
        # that looks nothing like its cause. Connecting as `dev` from the very
        # first chunk means hardening changes nothing about how we reach the host,
        # which is the property we want to be true on the VPS as well.
        #
        # `dev` is created by cloud-init with NOPASSWD sudo and the operator's
        # SSH key (virtual-box/build-vps-clone.sh). Chunk 10 asserts that this
        # works before it disables anything.
        ansible_user: dev
        ansible_become: true
        ansible_become_method: sudo
