---
# Chunk 07 — bring the stack up and verify it. SOP Steps 8 and 9, corrected for TLS.
#
# The verification here is the point of the chunk. SOP Step 8.2: /health,
# /_liveness and the NIP-11 document at / all return 200 even when the relay's
# address is completely wrong, so a relay that refuses every client passes all
# three. Only a real WebSocket upgrade proves the community binding, and over TLS
# that upgrade must be forced to HTTP/1.1 or curl negotiates HTTP/2 — which
# deleted the Connection/Upgrade mechanism — and quietly answers 200.

- name: "Chunk 07 — start the stack and prove it is usable (SOP Steps 8-9)"
  hosts: buzz_relay
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require the rendered configuration
      ansible.builtin.stat:
        path: "{{ buzz_compose_dir }}/.env"
      register: env_present

    - name: Fail clearly when chunk 06 has not run
      ansible.builtin.assert:
        that:
          - env_present.stat.exists
        fail_msg: "{{ buzz_compose_dir }}/.env is missing — run chunk 06 first."

  roles:
    # FIRST, ON EVERY PLAY IN THIS TREE. The pre_tasks above are read-only (stat +
    # assert), so this is still ahead of every host change — hardening-spec.md §B2
    # requires the plaintext check to be a precondition, and this play starts the
    # stack.
    - role: tls_mode_guard
    - role: relay_up
