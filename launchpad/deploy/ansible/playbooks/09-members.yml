---
# Chunk 09 — MEMBERSHIP. SOP Step 11 ("Approve people so they can connect").
#
# Reasoning lives in runbooks/dev-deployment-SOP.md and runbooks/hardening-spec.md sec-B13; the
# operation lives in runbooks/chunks/09-membership.md.
#
# The roster is supplied in `buzz_members` and is deliberately NOT in this repository
# (AGENTS.md rule 2 — no keys or identities in tracked files). Pass it at run time:
#
#   ansible-playbook playbooks/09-members.yml --limit dev-vm -e @$HOME/buzz-roster.yml
#
# `./deploy run 09` runs this playbook with no extra vars, so it only sees a roster that Ansible
# loads on its own. With the list outside the repo, use the command above.
- name: Chunk 09 — approve pubkeys on the relay roster
  hosts: buzz_relay
  # Deployment decision 6: connect as `dev` and escalate, on EVERY play. SOP Step 13.3 disables root
  # SSH login, so a play that depended on being root over SSH would break the moment chunk 10 runs.
  become: true
  # Nothing in this chunk asserts on host facts; the roster comes from the relay, not the host.
  gather_facts: false
  # One host at a time. Each relay has its own roster so this is not what protects the kind:13534
  # event — `throttle: 1`, the inter-add pause and the flock in roles/membership/tasks/main.yml are.
  # It keeps the output readable and makes an interrupted run affect one target only.
  serial: 1
  roles:
    - role: membership
      tags:
        - chunk09
        - membership
