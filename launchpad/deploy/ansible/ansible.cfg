# Ansible configuration for the Buzz deploy chunks.
#
# Read automatically only when ansible is invoked from this directory, which is
# why the `deploy` entrypoint cd's here first rather than exporting
# ANSIBLE_CONFIG. Keeping it implicit means a bare `ansible-playbook` run from
# this directory behaves identically to one driven by the entrypoint.

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# NOT `stdout_callback = yaml`. That resolved to community.general.yaml, which was
# removed in community.general 12.0.0 and now aborts every run with "callback
# plugin has been removed". The supported equivalent since ansible-core 2.13 is
# the built-in default callback plus result_format. Verified against
# ansible-core 2.21.2.
stdout_callback = default
result_format = yaml
# Reruns must converge (ansible/README.md "Convergence", Ruling 11, issue #36).
# A recap showing changed=0 on a second run is the check, so keep the recap terse
# enough to read at a glance.
display_skipped_hosts = false
display_ok_hosts = true
interpreter_python = auto_silent
# Roles reference `ansible_managed` in file headers. ansible-core 2.21 does not
# supply it implicitly — a template or `copy: content:` that uses it fails with
# "'ansible_managed' is undefined" rather than falling back to a default. Set it
# here so every generated file carries the same do-not-edit banner.
#
# Deliberately no {file}/{host}/{uid} expansions: those change per host and per
# run, so a file carrying them differs on every run and destroys the changed=0
# convergence signal.
ansible_managed = Managed by Ansible (launchpad/deploy/ansible). Do not edit by hand.
# No cows.
nocows = 1
# Facts are cheap here (one host) and several roles assert on them.
gathering = smart
retry_files_enabled = false

[ssh_connection]
# The dev VM answers on a NAT-forwarded port with a host key that changes every
# time the VM is rebuilt. Rebuilding is routine here, so a stale known_hosts
# entry would break every run with a scary-looking MITM warning. This is a
# loopback-only forward to a throwaway VM, so accepting a new key is safe.
#
# NEVER carry these two options over to the production VPS inventory. There,
# host key verification is the control that tells you you are talking to your
# own server. hosts.local.yml must not inherit them.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = true
