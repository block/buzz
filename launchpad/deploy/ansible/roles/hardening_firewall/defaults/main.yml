---
# roles/hardening_firewall/defaults/main.yml
#
# Ingress firewall for the Buzz relay host.
# Spec: dev-deployment-SOP.md Step 13.4, hardening-spec.md §C3 (ingress) and §B2 (the
# Docker/ufw trap and its required control 4).

# ---------------------------------------------------------------------------
# ufw policy
# ---------------------------------------------------------------------------

# Absolute path, deliberately. `ufw` lives in /usr/sbin, which is on sudo's secure_path on
# noble — but a lockout-critical role should not depend on that being true, and a
# "command not found" partway through a firewall sequence is the worst place to discover it.
hardening_firewall_ufw_bin: /usr/sbin/ufw

# Ports opened inbound. Made a variable specifically so prod can differ — per
# hardening-spec §C3 prod is "default deny inbound; allow only 443 (and 80 for ACME
# redirect, prod only) plus the mesh interface", and per §C1 prod eventually reaches
# `ufw deny 22` once SSM / a WireGuard mesh is the access path. Override in group_vars
# for the VPS; do not edit this default, which is the dev VM's list.
#
# 80 and 443 are here — and not in the SOP's literal Step 13.4 list — because the
# TLS-corrected path runs Caddy in dev too (hardening-spec §A.3), so the guest listens
# on 80/443 rather than publishing the relay on 3000. Guest-side ports stay 80/443;
# the host forwards 8080->80 and 8443->443 because macOS forbids non-root binding
# below 1024. The guest firewall therefore knows nothing about 8080/8443.
#
# LEFT MODE-INDEPENDENT DELIBERATELY, and 3000 is deliberately NOT added for the
# plaintext path. Two reasons, and the second is the important one:
#   1. Under the carve-out the relay is published on 127.0.0.1 inside the guest, and
#      ufw's before-rules unconditionally ACCEPT traffic on `lo` — so a `ufw allow
#      3000` would be a rule that governs nothing.
#   2. More to the point, ufw DOES NOT GOVERN DOCKER'S PUBLISHED PORTS AT ALL (see the
#      long comment above the §B2 assertion in tasks/main.yml). Adding 3000 here would
#      read as "the firewall permits the relay", which is a false statement about a
#      control that is not doing that work. The control is the bind address.
# Opening 80/443 on the plaintext path is harmless — nothing listens there — and
# keeping one list means the firewall's shape does not change between topologies.
hardening_firewall_allow_in:
  - 22/tcp
  - 80/tcp
  - 443/tcp

# Default policies, in `ufw default <policy> <direction>` wording.
# NOTE: `allow outgoing` is the SOP Step 13.4 / §C3 state. hardening-spec §C4 wants
# default-deny *egress* as well, but that is a separate control with its own allowlist
# and is deliberately not implemented here — do not flip this to `deny` without §C4's
# allowlist, or the host loses apt, ghcr.io and DNS in one task.
hardening_firewall_default_incoming: deny
hardening_firewall_default_outgoing: allow

# Constant, not a knob: how `ufw default <policy>` records itself in /etc/default/ufw.
# tasks/main.yml reads that file to decide whether the policy already matches, because
# `ufw default …` prints "Default incoming policy changed to …" and exits 0 whether or
# not anything changed, so its output cannot drive changed_when.
hardening_firewall_policy_file_values:
  deny: DROP
  allow: ACCEPT
  reject: REJECT

# ---------------------------------------------------------------------------
# hardening-spec §B2 required control 4 — no published port on a wildcard address
# ---------------------------------------------------------------------------

# Host addresses that mean "reachable from off-host" in `docker compose ps` output.
# The empty string is included so an unexpected/absent URL fails closed rather than
# passing the assert silently.
hardening_firewall_wildcard_addresses:
  - "0.0.0.0"
  - "::"
  - "[::]"
  - "*"
  - ""

# The published ports that are ALLOWED to sit on a wildcard address, because they are the
# intended public ingress. Everything else on a wildcard address is a finding.
#
# §B2 control 4 says "fails if any published port is bound to 0.0.0.0 or ::", and taken
# literally that fails on a correct stack: upstream `compose.caddy.yml` publishes caddy as
# "${CADDY_HTTP_PORT:-80}:80" and "${CADDY_HTTPS_PORT:-443}:443" with no host IP, so Docker
# binds both 0.0.0.0 and ::. That is Caddy doing its job as the reverse proxy. §B2's own
# nmap verification list (3000, 5432, 6379, 8080, 9000, 9001, 9090, 9102) deliberately omits
# 80 and 443 for the same reason, and §C3's policy is "allow only 443 (and 80 for ACME
# redirect, prod only)". So the control is read as "no port OTHER than the declared ingress".
#
# These are the GUEST-side published ports. Decision 4's host-side 8080/8443 forwards are a
# VirtualBox NAT concern and never appear in `docker compose ps`.
# Prod can narrow this — drop 80 if nothing needs the ACME/redirect vhost.
#
# MODE-AWARE, and note which way round. On the plaintext dev path the list is EMPTY, not
# `[3000]`: there is no reverse proxy, so nothing at all is supposed to be on a wildcard
# address, and the relay's 3000 is permitted only on loopback — which this assertion never
# sees, because it only inspects wildcard-bound publishers. Putting 3000 in this list would
# make `0.0.0.0:3000` — the exact exposure hardening-spec §B2 is about — pass the check.
# The loopback binding is asserted separately and positively, further down tasks/main.yml.
hardening_firewall_public_ingress_ports: >-
  {{ [] if not (buzz_tls_enabled | default(true) | bool) else [80, 443] }}

# ---------------------------------------------------------------------------
# hardening-spec §B2's approved dev carve-out — the positive half
# ---------------------------------------------------------------------------
#
# Ports the plaintext path IS allowed to publish, and the only addresses they may be bound
# to. Empty under every TLS mode, where the relay publishes nothing and Caddy's 80/443 are
# the intended wildcard ingress.
#
# The exception is conditional: plaintext is permitted "only when the corresponding host NAT
# forward is bound exactly to 127.0.0.1:3000", and verification "must assert the
# loopback-bound forward and must demonstrate that port 3000 is unreachable from another
# machine. If either property cannot be established, deployment fails closed." This role can
# only establish the guest-side half — the forward itself and the off-host demonstration
# belong to scripts/verify.sh, which runs on the machine where VBoxManage exists.
hardening_firewall_loopback_published_ports: >-
  {{ [3000] if not (buzz_tls_enabled | default(true) | bool) else [] }}

hardening_firewall_loopback_addresses: >-
  {{ buzz_loopback_addresses | default(['127.0.0.1', '::1', '[::1]']) }}

# Where the compose bundle landed (SOP Step 8.1). Defaults track a shared
# `buzz_compose_dir` / `buzz_compose_files` if the compose-bundle role or group_vars
# define one, so the two roles cannot drift apart.
hardening_firewall_compose_dir: "{{ buzz_compose_dir | default('/opt/buzz/compose') }}"
hardening_firewall_compose_env_file: "{{ buzz_compose_env_file | default('.env') }}"

# DERIVED from buzz_tls_mode via buzz_compose_files (group_vars/all.yml) — three files under
# a TLS mode, two on the plaintext default. compose.caddy.yml is what carries
# `relay: ports: !reset []` (hardening-spec §B2 required control 1); omitting it while a TLS
# mode is selected is how the plaintext-relay-on-3000 path comes back, which is what the
# assertion at the end of tasks/main.yml exists to catch.
#
# The fallback is the CLOSED three-file set, matching all.yml's production default, so a
# target missing the group var fails toward Caddy rather than toward plaintext.
hardening_firewall_compose_files: >-
  {{ buzz_compose_files
     | default(['compose.yml', 'compose.caddy.yml', 'compose.cohort.yml']) }}
