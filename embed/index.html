<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-HMoFaQe5M9Vr2eGJ4swZml5ZFK2xrdI3Hev//d0phWo='; style-src 'unsafe-inline'; frame-src https:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedded content</title>
<style>
  html, body, iframe { display: block; margin: 0; width: 100%; height: 100%; border: 0; background: black; }
</style>
</head>
<body>
<script>
  const PARENTS = new Set(['tauri://localhost', 'http://tauri.localhost', 'https://tauri.localhost']);

  function destination(src, selfOrigin) {
    if (typeof src !== 'string') return null;
    let url;
    try {
      url = new URL(src);
    } catch {
      return null;
    }
    if (!/^https:\/\/[a-z0-9.-]+(?::[0-9]{1,5})?$/i.test(url.origin) ||
        url.protocol !== 'https:' || url.username || url.password || url.origin === selfOrigin ||
        url.hostname.endsWith('.') || url.hostname === 'localhost' || url.hostname.endsWith('.localhost') ||
        url.hostname.startsWith('127.') || url.hostname === '0.0.0.0') return null;
    return url;
  }

  function transition(state, message, selfOrigin) {
    if (state !== 'waiting' || !message.fromParent || message.type !== 'buzz-embed:mount') {
      return { state, action: 'ignore' };
    }
    const url = PARENTS.has(message.origin) ? destination(message.src, selfOrigin) : null;
    return url
      ? { state: 'mounted', action: 'mount', href: url.href, frameSrc: url.origin }
      : { state: 'refused', action: 'refuse' };
  }

  let state = 'inactive';

  function apply(result) {
    state = result.state;
    if (result.action === 'ignore') return;
    removeEventListener('message', onMessage);
    if (result.action === 'refuse') {
      parent.postMessage({ type: 'buzz-embed:refused' }, '*');
      return;
    }

    const policy = document.createElement('meta');
    policy.httpEquiv = 'Content-Security-Policy';
    policy.content = 'frame-src ' + result.frameSrc;
    document.head.append(policy);

    const frame = document.createElement('iframe');
    frame.title = document.title;
    frame.sandbox = 'allow-scripts allow-same-origin allow-presentation allow-popups allow-popups-to-escape-sandbox';
    frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    frame.allowFullscreen = true;
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.src = result.href;
    document.body.append(frame);
    parent.postMessage({ type: 'buzz-embed:mounted' }, '*');
  }

  function onMessage(event) {
    apply(transition(state, {
      fromParent: event.source === parent,
      origin: event.origin,
      type: event.data?.type,
      src: event.data?.src,
    }, location.origin));
  }

  if (self !== parent && self.origin === location.origin) {
    state = 'waiting';
    addEventListener('message', onMessage);
    parent.postMessage({ type: 'buzz-embed:ready' }, '*');
  }
</script>
</body>
</html>
